    :root {

function detectCurrency() {
  try {
    const lang = (navigator.language || "en-US").toLowerCase();
    const tz = Intl.DateTimeFormat().resolvedOptions().timeZone || "";
    if (lang.startsWith("en-gb") || tz.includes("London") || tz === "Europe/London")
      return { symbol: "£", code: "GBP", monthly: 15, yearly: 150 };
    const euLangs = ["de","fr","it","es","nl","pt","pl","ro","cs","hu","sk","fi","sv","da","el","bg","hr","lt","lv","et","sl","mt","ga"];
    const euTz = ["Europe/Berlin","Europe/Paris","Europe/Rome","Europe/Madrid","Europe/Amsterdam","Europe/Brussels","Europe/Vienna","Europe/Warsaw","Europe/Lisbon","Europe/Athens","Europe/Dublin","Europe/Zurich","Europe/Stockholm","Europe/Helsinki","Europe/Prague","Europe/Budapest"];
    if (euLangs.some(l => lang.startsWith(l)) || euTz.some(t => tz === t || tz.includes(t.replace("Europe/",""))) || lang.startsWith("en-ie") || lang.startsWith("en-mt"))
      return { symbol: "€", code: "EUR", monthly: 17, yearly: 170 };
  } catch {}
  return { symbol: "$", code: "USD", monthly: 19, yearly: 190 };
}

function utcMinutes() {
  const d = new Date();
  return d.getUTCHours() * 60 + d.getUTCMinutes();
}

function sessionStatus(s, now) {
  const openM = s.open * 60, closeM = s.close * 60;
  if (closeM < openM) {
    if (now >= openM || now < closeM) return "open";
    let left = openM - now; if (left < 0) left += 1440;
    return left <= 30 ? "soon" : "closed";
  }
  if (now >= openM && now < closeM) return "open";
  let left = openM - now; if (left < 0) left += 1440;
  return left <= 30 ? "soon" : "closed";
}

function minsToClose(s, now) {
  const closeM = s.close * 60, openM = s.open * 60;
  if (closeM < openM) {
    if (now >= openM) return 1440 - now + closeM;
    return closeM - now;
  }
  return closeM - now;
}

function minsToOpen(openH, now) {
  let r = openH * 60 - now;
  if (r < 0) r += 1440;
  return r;
}

function fmtMins(m) {
  const h = Math.floor(m / 60), mm = m % 60;
  return h > 0 ? `${h}h ${String(mm).padStart(2, "0")}m` : `${mm}m`;
}

function normalizeSymbol(raw) {
  let s = (raw || "").toUpperCase().replace(/[\/\s_]/g, "");
  if (!s) return "";
  if (s === "GOLD") s = "XAUUSD";
  if (s === "WTI") s = "WTIUSD";
  if (s === "APPLE") s = "AAPL";
  if (s === "SILVER") s = "XAGUSD";
  if (s === "BITCOIN") s = "BTCUSD";
  if (s === "EURIPY") s = "EURJPY";
  return s;
}

function downloadText(filename, text, mime) {
  const blob = new Blob([text], { type: mime || "text/plain" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function formatReportStamp(ts) {
  const d = new Date(ts);
  const date = d.toUTCString().slice(5, 16);
  const time = String(d.getUTCHours()).padStart(2, "0") + ":" + String(d.getUTCMinutes()).padStart(2, "0") + " UTC";
  return { date: date, time: time, full: date + " • " + time };
}

function pricePrefix(symbol) {
  if (["XAUUSD", "GOLD", "XAGUSD", "SILVER", "WTIUSD", "WTI", "AAPL", "APPLE"].includes(symbol)) return "$";
  return "";
}

/* Live mid price from the SAME TradingView symbol used by the chart — keeps banner = chart */
async function fetchTvLivePrice(symbol) {
  var tv = tvSymbolFor(symbol);
  try {
    var url = "https://scanner.tradingview.com/symbol?symbol=" + encodeURIComponent(tv) + "&fields=lp,bid,ask,ch,chp,open_price,prev_close_price,description";
    var res = await fetch(url, { method: "GET", cache: "no-store" });
    if (res.ok) {
      var d = await res.json();
      if (d && !d.code) {
        var lp = null;
        if (d.lp != null && isFinite(Number(d.lp)) && Number(d.lp) > 0) lp = Number(d.lp);
        else if (d.bid != null && d.ask != null && isFinite(Number(d.bid)) && isFinite(Number(d.ask))) lp = (Number(d.bid) + Number(d.ask)) / 2;
        else if (d.bid != null && isFinite(Number(d.bid)) && Number(d.bid) > 0) lp = Number(d.bid);
        else if (d.ask != null && isFinite(Number(d.ask)) && Number(d.ask) > 0) lp = Number(d.ask);
        if (lp != null && lp > 0) {
          var chp = (d.chp != null && isFinite(Number(d.chp))) ? Number(d.chp) : null;
          var ch = (d.ch != null && isFinite(Number(d.ch))) ? Number(d.ch) : null;
          return { price: lp, changePct: chp, change: ch, source: "tradingview", tvSymbol: tv };
        }
      }
    }
  } catch (e) {}
  return null;
}

async function fetchCandles(symbol, tf) {
  var ref = REF_PRICE[symbol] || 100;

  // Yahoo first (real OHLC + timestamps) — FX pairs use GBPUSD=X etc.
  var ySym = YAHOO_SYMBOL[symbol];
  if (ySym) {
    try {
      var yUrl = "https://query1.finance.yahoo.com/v8/finance/chart/" + encodeURIComponent(ySym) + "?interval=30m&range=5d";
      var yRes = await fetch(yUrl);
      if (yRes.ok) {
        var yData = await yRes.json();
        var result = yData.chart.result[0];
        var q = result.indicators.quote[0];
        var ts = (result.timestamp || []);
        var rows = [];
        for (var i = 0; i < q.close.length; i++) {
          if (q.close[i] == null || q.open[i] == null) continue;
          rows.push({
            open: q.open[i], high: q.high[i], low: q.low[i], close: q.close[i],
            t: (ts[i] != null ? ts[i] * 1000 : null)
          });
        }
        if (rows.length > 10) {
          var lastC = rows[rows.length - 1].close;
          if (ref > 0) {
            if (lastC > ref * 0.35 && lastC < ref * 2.8) return rows;
          } else if (lastC > 0) {
            return rows;
          }
        }
      }
    } catch (e1) {}
    // Fallback host / daily bars if 30m blocked
    try {
      var yUrl2 = "https://query2.finance.yahoo.com/v8/finance/chart/" + encodeURIComponent(ySym) + "?interval=1h&range=10d";
      var yRes2 = await fetch(yUrl2);
      if (yRes2.ok) {
        var yData2 = await yRes2.json();
        var result2 = yData2.chart.result[0];
        var q2 = result2.indicators.quote[0];
        var ts2 = (result2.timestamp || []);
        var rows2 = [];
        for (var i2 = 0; i2 < q2.close.length; i2++) {
          if (q2.close[i2] == null || q2.open[i2] == null) continue;
          rows2.push({
            open: q2.open[i2], high: q2.high[i2], low: q2.low[i2], close: q2.close[i2],
            t: (ts2[i2] != null ? ts2[i2] * 1000 : null)
          });
        }
        if (rows2.length > 5) {
          var last2 = rows2[rows2.length - 1].close;
          if (!ref || (last2 > ref * 0.35 && last2 < ref * 2.8)) return rows2;
        }
      }
    } catch (e1b) {}
  }

  // Binance crypto
  var bnSym = BINANCE_MAP[symbol];
  if (bnSym) {
    try {
      var bnUrl = "https://api.binance.com/api/v3/klines?symbol=" + bnSym + "&interval=30m&limit=120";
      var bnRes = await fetch(bnUrl);
      if (bnRes.ok) {
        var bnData = await bnRes.json();
        if (bnData.length > 20) {
          return bnData.map(function(k) {
            return { open: parseFloat(k[1]), high: parseFloat(k[2]), low: parseFloat(k[3]), close: parseFloat(k[4]), t: parseFloat(k[0]) };
          });
        }
      }
    } catch (e2) {}
  }

  // Safe synthetic around reference
  var price = ref;
  var out = [];
  var vol = ref >= 50 ? ref * 0.001 : ref * 0.0008;
  for (var k = 0; k < 80; k++) {
    var noise = (Math.random() - 0.5) * vol;
    price = price + noise;
    if (price < ref * 0.99) price = ref * 0.99;
    if (price > ref * 1.01) price = ref * 1.01;
    out.push({ open: price, close: price, high: price + Math.abs(noise), low: price - Math.abs(noise) });
  }
  return out;
}

function sma(candles, period) {
  var out = [];
  for (var i = 0; i < candles.length; i++) {
    if (i < period - 1) { out.push(null); continue; }
    var sum = 0;
    for (var j = i - period + 1; j <= i; j++) sum += candles[j].close;
    out.push(sum / period);
  }
  return out;
}

async function fetchWeeklyHistory(symbol) {
  var ySym = YAHOO_SYMBOL[symbol];
  var alts = [];
  if (ySym) alts.push(ySym);
  if (symbol === "XAUUSD" || symbol === "GOLD") alts = alts.concat(["GC=F", "XAUUSD=X", "GOLD"]);
  if (symbol === "WTIUSD" || symbol === "WTI") alts = alts.concat(["CL=F", "BZ=F"]);
  if (symbol === "XAGUSD" || symbol === "SILVER") alts = alts.concat(["SI=F"]);
  /* unique */
  alts = alts.filter(function(v, i, a) { return v && a.indexOf(v) === i; });
  function parseYahooChart(data) {
    try {
      var result = data.chart.result[0];
      var q = result.indicators.quote[0];
      var ts = result.timestamp || [];
      var rows = [];
      for (var i = 0; i < q.close.length; i++) {
        if (q.close[i] == null || q.high[i] == null || q.low[i] == null) continue;
        rows.push({ t: (ts[i] || 0) * 1000, open: q.open[i], high: q.high[i], low: q.low[i], close: q.close[i] });
      }
      return rows;
    } catch (e) { return []; }
  }
  var hosts = ["https://query1.finance.yahoo.com", "https://query2.finance.yahoo.com"];
  var ranges = [
    { interval: "1wk", range: "5y" },
    { interval: "1wk", range: "2y" },
    { interval: "1d", range: "2y" }
  ];
  for (var a = 0; a < alts.length; a++) {
    for (var h = 0; h < hosts.length; h++) {
      for (var r = 0; r < ranges.length; r++) {
        try {
          var url = hosts[h] + "/v8/finance/chart/" + encodeURIComponent(alts[a]) + "?interval=" + ranges[r].interval + "&range=" + ranges[r].range;
          var res = await fetch(url, { cache: "no-store" });
          if (!res.ok) continue;
          var data = await res.json();
          var rows = parseYahooChart(data);
          if (rows.length > 20) return rows;
        } catch (eTry) {}
      }
    }
  }
  return [];
}

function fmtLevelDate(ms) {
  if (!ms) return "—";
  try {
    var d = new Date(ms);
    return d.toUTCString().slice(5, 16);
  } catch (e) { return "—"; }
}

/* Count historical tests of support/resistance over weekly bars (lookback ~2–5y) */
function analyzeLevelMemory(weekly, support, resistance, priceNum, meta) {
  var s = parseFloat(support);
  var r = parseFloat(resistance);
  var p = Number(priceNum);
  var empty = {
    lookbackYears: 0, bars: 0,
    supportTests: 0, resistanceTests: 0,
    supportDates: [], resistanceDates: [],
    rangeLow: null, rangeHigh: null, trendSlope: "flat",
    dataQuality: "none",
    note: "No verified weekly history — test counts withheld."
  };
  meta = meta || {};
  /* Reject synthetic short-horizon bars (inflates tests to nonsense like 80x same week) */
  if (meta.synthetic) return empty;
  if (!weekly || !weekly.length || !(p > 0)) return empty;
  var span = 0;
  if (weekly[0].t && weekly[weekly.length - 1].t) {
    span = weekly[weekly.length - 1].t - weekly[0].t;
  }
  /* Need at least ~6 months of real history */
  if (span < 180 * 24 * 3600 * 1000) {
    return Object.assign({}, empty, {
      bars: weekly.length,
      dataQuality: "short",
      note: "History window too short for reliable multi-year level tests."
    });
  }
  /* Tighter band: gold ~0.15% (~$6 at 4000) — not 0.4% which counts almost every bar */
  var tol = p >= 500 ? p * 0.0015 : (p >= 50 ? p * 0.0025 : p * 0.0012);
  var sWeeks = {};
  var rWeeks = {};
  var sTouches = [];
  var rTouches = [];
  var minL = Infinity, maxH = -Infinity;
  var first = weekly[0].close, last = weekly[weekly.length - 1].close;
  for (var i = 0; i < weekly.length; i++) {
    var bar = weekly[i];
    if (bar.low < minL) minL = bar.low;
    if (bar.high > maxH) maxH = bar.high;
    var weekKey = "";
    try {
      var d = new Date(bar.t);
      weekKey = d.getUTCFullYear() + "-W" + Math.floor((d.getUTCMonth() * 30 + d.getUTCDate()) / 7);
    } catch (eK) { weekKey = String(bar.t); }
    /* Touch = bar traded through the level (high/low spans it) */
    if (isFinite(s) && bar.low <= s && bar.high >= s) {
      if (!sWeeks[weekKey]) {
        sWeeks[weekKey] = true;
        sTouches.push(bar.t);
      }
    }
    if (isFinite(r) && bar.low <= r && bar.high >= r) {
      if (!rWeeks[weekKey]) {
        rWeeks[weekKey] = true;
        rTouches.push(bar.t);
      }
    }
  }
  var years = span / (365.25 * 24 * 3600 * 1000);
  var slope = last > first * 1.03 ? "up" : last < first * 0.97 ? "down" : "flat";
  /* If >35% of weekly bars "touch" the level, level is just near the whole sample median — not a documented S/R memory */
  var maxMeaningful = Math.max(5, Math.floor(weekly.length * 0.5));
  var sCount = sTouches.length;
  var rCount = rTouches.length;
  /* Always show real counts when > 0; only hide if absurdly noisy */
  var sValid = sCount > 0 && sCount <= maxMeaningful;
  var rValid = rCount > 0 && rCount <= maxMeaningful;
  return {
    lookbackYears: Math.round(years * 10) / 10,
    bars: weekly.length,
    supportTests: sValid ? sCount : (sCount > 0 ? Math.min(sCount, maxMeaningful) : 0),
    resistanceTests: rValid ? rCount : (rCount > 0 ? Math.min(rCount, maxMeaningful) : 0),
    supportDates: sTouches.length ? sTouches.slice(-12).reverse().map(fmtLevelDate) : [],
    resistanceDates: rTouches.length ? rTouches.slice(-12).reverse().map(fmtLevelDate) : [],
    rangeLow: isFinite(minL) ? minL : null,
    rangeHigh: isFinite(maxH) ? maxH : null,
    trendSlope: slope,
    dataQuality: "weekly",
    source: "Yahoo Finance weekly (GC=F / CL=F etc.)",
    note: sValid || rValid
      ? ("Documented: distinct calendar weeks where weekly bar traded through the level. Source: Yahoo weekly history ~" + (Math.round(years * 10) / 10) + "y. Not a trade signal.")
      : ("Level sits inside common price area of the sample — historical touch count not shown (would be noise, not documentation).")
  };
}

function newsAssetKey(symbol) {

  if (s.indexOf("WTI") >= 0 || s.indexOf("OIL") >= 0 || s.indexOf("BRENT") >= 0 || s === "USOIL") return "WTIUSD";
  if (s.indexOf("BTC") >= 0 || s === "BITCOIN") return "BTCUSD";
  if (s === "AAPL" || s === "APPLE") return "AAPL";
  if (s.indexOf("EUR") >= 0 && s.indexOf("USD") >= 0) return "EURUSD";
  if (s.indexOf("GBP") >= 0 && s.indexOf("USD") >= 0) return "GBPUSD";
  if (s === "USDJPY" || s === "GBPJPY" || s === "EURJPY") return s;
  return NEWS_BY_ASSET[s] ? s : "DEFAULT";
}

function pickNewsLine(source, seed, symbol) {
  var key = newsAssetKey(symbol);
  var pack = NEWS_BY_ASSET[key] || NEWS_BY_ASSET.DEFAULT;
  var bank = pack[source] || pack.Bloomberg || NEWS_BY_ASSET.DEFAULT.Bloomberg;
  return bank[Math.abs(seed) % bank.length];
}

function gpBody(c) {

  return Math.abs(Number(c.close) - Number(c.open));
}
function gpIsBull(c) { return c && Number(c.close) > Number(c.open); }
function gpIsBear(c) { return c && Number(c.close) < Number(c.open); }

function gpAntiSpamKey(module, asset, tf) {

function gpCanAlert(module, asset, tf, cooldownMs) {

/* MODULE 1 — MA50 Two-Candle Structure */
function detectMA50Structure(candles, ma50, priceNum) {
  if (!candles || candles.length < 10 || !ma50) return null;
  var n = candles.length;
  var last = candles[n - 1];
  var lastMa = ma50[n - 1];
  if (lastMa == null || !(priceNum > 0)) return null;
  var above = priceNum > lastMa;
  var bullCloses = [];
  var bearCloses = [];
  for (var i = Math.max(0, n - 30); i < n; i++) {
    if (ma50[i] == null) continue;
    var c = candles[i];
    if (gpIsBull(c) && Number(c.close) > ma50[i]) bullCloses.push(i);
    if (gpIsBear(c) && Number(c.close) < ma50[i]) bearCloses.push(i);
  }
  if (above && bullCloses.length >= 2) {
    /* Guide: two closed bullish candles above MA50 (not required consecutive) + price above MA50 */
    var crossedUp = false;
    for (var j = Math.max(1, n - 60); j < n; j++) {
      if (ma50[j - 1] != null && ma50[j] != null) {
        if (Number(candles[j - 1].close) <= Number(ma50[j - 1]) && Number(candles[j].close) > Number(ma50[j])) {
          crossedUp = true; break;
        }
      }
    }
    /* Also accept: last 2 closed candles both bullish and both fully above MA50 */
    var c1 = candles[n - 1], c2 = candles[n - 2];
    var ma1 = ma50[n - 1], ma2 = ma50[n - 2];
    var twoAbove = (
      ma1 != null && ma2 != null &&
      gpIsBull(c1) && gpIsBull(c2) &&
      Number(c1.close) > Number(ma1) && Number(c1.open) > Number(ma1) &&
      Number(c2.close) > Number(ma2) && Number(c2.open) > Number(ma2)
    );
    if (crossedUp || twoAbove || (bullCloses.length >= 2 && priceNum > lastMa)) {
      return {
        module: "ma50",
        bias: "bullish",
        stars: 1,
        title: "MA50 Structure",
        detail: "Two closed candles above MA50. Price context: Currently above 50-period average.",
        notifyBody: "MA50 Structure: Two closed candles above MA50.\nPrice context: Currently above 50-period average."
      };
    }
  }
  if (!above && bearCloses.length >= 2) {
    var crossedDown = false;
    for (var k = Math.max(1, n - 40); k < n; k++) {
      if (ma50[k - 1] != null && ma50[k] != null) {
        if (candles[k - 1].close > ma50[k - 1] && candles[k].close < ma50[k]) { crossedDown = true; break; }
      }
    }
    if (crossedDown || (bearCloses.length >= 3 && priceNum < lastMa * 0.9995)) {
      return {
        module: "ma50",
        bias: "bearish",
        stars: 1,
        title: "MA50 Structure",
        detail: "Two closed candles below MA50. Price context: Currently below 50-period average.",
        notifyBody: "MA50 Structure: Two closed candles below MA50.\nPrice context: Currently below 50-period average."
      };
    }
  }
  return null;
}

/* MODULE 2 — Engulfing Candle Structure */
function detectEngulfing(candles, ma50, priceNum) {
  if (!candles || candles.length < 8) return null;
  var n = candles.length;
  var cur = candles[n - 1];
  var prev = candles[n - 2];
  var lastMa = ma50 && ma50[n - 1];
  if (lastMa == null) return null;
  var curBody = gpBody(cur);
  var prevBody = gpBody(prev);
  if (!(prevBody > 0) || !(curBody > 0)) return null;
  var ratio = curBody / prevBody;
  if (ratio < 4) return null;
  var maxPrev5 = 0;
  for (var i = n - 6; i < n - 1; i++) {
    if (i >= 0) maxPrev5 = Math.max(maxPrev5, gpBody(candles[i]));
  }
  if (curBody <= maxPrev5) return null;
  var above = priceNum > lastMa;
  /* Bearish engulfing against bullish context */
  if (above && gpIsBear(cur)) {
    return {
      module: "engulfing",
      bias: "bearish",
      stars: 1,
      ratio: Math.round(ratio * 10) / 10,
      title: "Engulfing Structure",
      detail: "Bearish candle engulfing previous body. Strength ratio: " + (Math.round(ratio * 10) / 10) + "x. Largest in last 5 candles. Context: Price above MA50 — potential reversal structure.",
      notifyBody: "Engulfing Structure: Bearish candle engulfing previous body.\nStrength ratio: " + (Math.round(ratio * 10) / 10) + "x previous candle body.\nRelative size: Largest in last 5 candles.\nContext: Price above MA50. Pattern represents potential reversal structure."
    };
  }
  /* Bullish engulfing against bearish context */
  if (!above && gpIsBull(cur)) {
    return {
      module: "engulfing",
      bias: "bullish",
      stars: 1,
      ratio: Math.round(ratio * 10) / 10,
      title: "Engulfing Structure",
      detail: "Bullish candle engulfing previous body. Strength ratio: " + (Math.round(ratio * 10) / 10) + "x. Largest in last 5 candles. Context: Price below MA50 — potential reversal structure.",
      notifyBody: "Engulfing Structure: Bullish candle engulfing previous body.\nStrength ratio: " + (Math.round(ratio * 10) / 10) + "x previous candle body.\nRelative size: Largest in last 5 candles.\nContext: Price below MA50. Pattern represents potential reversal structure."
    };
  }
  return null;
}

/* MODULE 3 — Dynamic Price Cluster */
function detectDynamicCluster(candles, priceNum) {
  if (!candles || candles.length < 20 || !(priceNum > 0)) return null;
  var closes = [];
  var start = Math.max(0, candles.length - 100);
  for (var i = start; i < candles.length; i++) {
    if (candles[i].close != null) closes.push(Number(candles[i].close));
  }
  if (closes.length < 20) return null;
  var tol = priceNum * 0.02;
  var bestCount = 0;
  var bestLevel = null;
  for (var a = 0; a < closes.length; a++) {
    var lvl = closes[a];
    var cnt = 0;
    for (var b = 0; b < closes.length; b++) {
      if (Math.abs(closes[b] - lvl) <= tol) cnt++;
    }
    if (cnt > bestCount) { bestCount = cnt; bestLevel = lvl; }
  }
  if (bestCount < 3 || bestLevel == null) return null;
  var zoneTol = bestLevel * 0.02;
  if (Math.abs(priceNum - bestLevel) > zoneTol) return null;
  var isSupport = priceNum >= bestLevel;
  var decimals = priceNum > 50 ? 2 : 4;
  var levelStr = Number(bestLevel).toFixed(decimals);
  return {
    module: "cluster",
    bias: isSupport ? "support" : "resistance",
    stars: 1,
    level: bestLevel,
    density: bestCount,
    title: "Dynamic Zone Active",
    detail: "Price approaching historical cluster at " + levelStr + ". Classification: " + (isSupport ? "Support (price currently above level)" : "Resistance (price currently below level)") + ". Cluster density: " + bestCount + " of last 100 candles.",
    notifyBody: "Dynamic Zone Active: Price approaching historical cluster.\nLevel: " + levelStr + "\nClassification: " + (isSupport ? "Support (price currently above level)" : "Resistance (price currently below level)") + "\nCluster density: " + bestCount + " of last 100 candles closed within this zone."
  };
}

/* System notification via Service Worker — background + lock screen when permitted */
async function gpNotify(title, body, tag, extra) {
  extra = extra || {};
  var ok = false;
  try {
    if (typeof Notification === "undefined") return false;
    if (Notification.permission === "default") {
      try { await Notification.requestPermission(); } catch (e) {}
    }
    if (Notification.permission !== "granted") return false;
    var opts = {
      body: body || "",
      tag: tag || ("gp-" + Date.now()),
      renotify: true,
      requireInteraction: !!extra.pattern,
      silent: false,
      vibrate: extra.pattern ? [200, 100, 200, 100, 200] : [120, 60, 120],
      data: {
        source: "goldpro",
        material: extra.material || "",
        reportId: extra.reportId || "",
        pattern: !!extra.pattern,
        url: extra.url || (typeof location !== "undefined" ? location.href.split("#")[0] : "/")
      }
    };
    /* 1) Direct Notification — works even without service worker when app is open */
    try {
      var n = new Notification(title || "Gold Pro", opts);
      ok = true;
      try { n.onclick = function() { try { window.focus(); n.close(); } catch (eC) {} }; } catch (eO) {}
    } catch (e2) {}
    /* 2) Service worker path — better when tab is backgrounded */
    if (navigator.serviceWorker) {
      try {
        var reg = await Promise.race([
          navigator.serviceWorker.ready,
          new Promise(function(r) { setTimeout(function() { r(null); }, 1500); })
        ]);
        if (reg && reg.showNotification) {
          await reg.showNotification(title || "Gold Pro", opts);
          ok = true;
        } else if (reg && reg.active) {
          reg.active.postMessage({
            type: "gp-notify",
            title: title || "Gold Pro",
            body: body || "",
            tag: opts.tag,
            pattern: !!extra.pattern,
            material: extra.material || "",
            reportId: extra.reportId || "",
            url: opts.data.url
          });
          ok = true;
        }
      } catch (e1) {}
    }
  } catch (e) {}
  return ok;
}

function urlBase64ToUint8Array(base64String) {
  var padding = "=".repeat((4 - (base64String.length % 4)) % 4);
  var base64 = (base64String + padding).replace(/-/g, "+").replace(/_/g, "/");
  var rawData = atob(base64);
  var outputArray = new Uint8Array(rawData.length);
  for (var i = 0; i < rawData.length; ++i) outputArray[i] = rawData.charCodeAt(i);
  return outputArray;
}

/* Subscribe to Web Push so server can wake the device when app is closed (like WhatsApp) */
async function ensurePushSubscription() {
  try {
    if (!("serviceWorker" in navigator) || !("PushManager" in window)) return null;
    if (typeof Notification === "undefined") return null;
    if (Notification.permission !== "granted") return null;
    var reg = await navigator.serviceWorker.ready;
    var existing = await reg.pushManager.getSubscription();
    if (existing) {
      try { localStorage.setItem("gp_push_endpoint", existing.endpoint); } catch (e) {}
      return existing;
    }
    var vapid =
      (typeof localStorage !== "undefined" && localStorage.getItem("gp_vapid_key")) ||
      (typeof window !== "undefined" && window.GP_VAPID_PUBLIC_KEY) ||
      "";
    var opts = { userVisibleOnly: true };
    if (vapid) {
      try { opts.applicationServerKey = urlBase64ToUint8Array(vapid); } catch (e2) {}
    }
    var sub = await reg.pushManager.subscribe(opts);
    try { localStorage.setItem("gp_push_endpoint", sub.endpoint); } catch (e3) {}
    /* Tell backend so it can push when pattern fires while app is closed */
    try {
      var api = (typeof API_BASE !== "undefined" ? API_BASE : "") + "/push/subscribe";
      await fetch(api, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          subscription: sub.toJSON(),
          app: "goldpro",
          user: (typeof localStorage !== "undefined" && localStorage.getItem("gp_profile")) || null
        })
      });
    } catch (e4) {}
    return sub;
  } catch (e) {
    if (GP_DEBUG) console.warn("[Gold Pro] push subscribe failed", e && e.message);
    return null;
  }
}

async function ensureNotificationPermission() {
  try {
    if (typeof Notification === "undefined") return false;
    if (Notification.permission === "granted") {
      try { await ensurePushSubscription(); } catch (e) {}
      return true;
    }
    if (Notification.permission === "denied") return false;
    var r = await Notification.requestPermission();
    if (r === "granted") {
      try { await ensurePushSubscription(); } catch (e2) {}
      return true;
    }
  } catch (e) {}
  return false;
}

/* Register service worker once (needs https or localhost — required for closed-app push) */
(function registerGpSw() {
  try {
    if (!("serviceWorker" in navigator)) return;
    var SW_CODE = [
      "self.addEventListener('install', function(e){ self.skipWaiting(); });",
      "self.addEventListener('activate', function(e){ e.waitUntil(self.clients.claim()); });",
      "self.addEventListener('message', function(e){",
      "  var d = e.data || {};",
      "  if (d.type === 'gp-skip-waiting') { self.skipWaiting(); return; }",
      "  if (d.type === 'gp-notify') {",
      "    e.waitUntil(self.registration.showNotification(d.title || 'Gold Pro', {",
      "      body: d.body || '', tag: d.tag || ('gp-' + Date.now()), renotify: true,",
      "      vibrate: d.pattern ? [200,100,200] : [100],",
      "      data: { source: 'goldpro', material: d.material || '', reportId: d.reportId || '', url: d.url || '/' }",
      "    }));",
      "  }",
      "});",
      "self.addEventListener('notificationclick', function(e){",
      "  e.notification.close();",
      "  var url = (e.notification.data && e.notification.data.url) || '/';",
      "  e.waitUntil(clients.matchAll({ type: 'window', includeUncontrolled: true }).then(function(list){",
      "    for (var i=0;i<list.length;i++){ if (list[i].focus) return list[i].focus(); }",
      "    if (clients.openWindow) return clients.openWindow(url);",
      "  }));",
      "});",
      "self.addEventListener('push', function(e){",
      "  var data = {}; try { data = e.data ? e.data.json() : {}; } catch (err) {}",
      "  e.waitUntil(self.registration.showNotification(data.title || 'Gold Pro', {",
      "    body: data.body || 'New market report', tag: data.tag || 'gp-push', renotify: true",
      "  }));",
      "});"
    ].join("\n");
    function afterReg(reg) {
      if (GP_DEBUG) console.log("[Gold Pro] service worker ready");
      try { if (reg.waiting) reg.waiting.postMessage({ type: "gp-skip-waiting" }); } catch (e) {}
      setTimeout(function () { try { ensurePushSubscription(); } catch (e2) {} }, 1500);
    }
    navigator.serviceWorker.register("gp-sw.js", { scope: "./" }).then(afterReg).catch(function () {
      try {
        var blob = new Blob([SW_CODE], { type: "application/javascript" });
        var blobUrl = URL.createObjectURL(blob);
        navigator.serviceWorker.register(blobUrl, { scope: "./" }).then(afterReg).catch(function (err2) {
          if (GP_DEBUG) console.warn("[Gold Pro] SW unavailable (need https). Toasts still work.", err2 && err2.message);
        });
      } catch (err3) {
        if (GP_DEBUG) console.warn("[Gold Pro] SW unavailable", err3 && err3.message);
      }
    });
    navigator.serviceWorker.addEventListener("message", function (ev) {
      var d = ev.data || {};
      if (d.type === "gp-push-resubscribe") {
        try { ensurePushSubscription(); } catch (e) {}
      }
    });
  } catch (e) {}
})();

    }
    function alreadyFired(key) {
      try { return localStorage.getItem("gp_last_hourly_utc") === key; } catch (e) { return false; }
    }
    function markFired(key) {
      try { localStorage.setItem("gp_last_hourly_utc", key); } catch (e) {}
    }
    function maybeHourly(reason) {
      if (adminCfgRef.current && adminCfgRef.current.hourlyReports === false) return;
      var key = utcHourKey();
      if (alreadyFired(key)) return;
      /* One GOLD+WTI pair per UTC hour. Key stops doubles.
         reason force/visible/poll all allowed so mobile can catch up after background throttle. */
      markFired(key);

      var now = new Date();
      var next = new Date(now);
      next.setUTCMinutes(0, 0, 0);
      next.setUTCHours(now.getUTCHours() + 1);
      var ms = next - now;
      if (ms < 1500) ms += 3600000;
      return ms;
    }

      maybeHourly("top");

    }, getMsUntilNextHour());

                    setInboxOffset(function(prev) {
                      var next = prev + dir;
                      if (next < 0) next = 0;
                      if (next > maxOff) next = maxOff;
                      if (next !== prev) {
                        try { playInboxTick(); } catch (err) {}
                      }
                      return next;
                    });

                  return (
                    <div style={{ border: "1px solid #1a1a1a", borderRadius: 12, overflow: "hidden", background: "#000" }}>
                      <button
                        onClick={function() { step(-1); }}
                        disabled={off <= 0}
                        className="active-scale"
                        style={{ width: "100%", background: "#0a0a0a", border: "none", borderBottom: "1px solid #1a1a1a", color: off <= 0 ? "#333" : "#aaa", padding: "8px 0", fontWeight: 900, fontSize: 12, cursor: off <= 0 ? "default" : "pointer" }}

                                <div style={{ fontSize: 11, color: "#aaa", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{item.structure || item.trend} · {item.price}</div>

                            >🗑</button>
                          </div>

                      <button
                        onClick={function() { step(1); }}
                        disabled={off >= maxOff}
                        className="active-scale"
                        style={{ width: "100%", background: "#0a0a0a", border: "none", borderTop: "1px solid #1a1a1a", color: off >= maxOff ? "#333" : "#aaa", padding: "8px 0", fontWeight: 900, fontSize: 12, cursor: off >= maxOff ? "default" : "pointer" }}

                </div>
              ) : null}
              {adminOpen && adminUnlocked ? (
                <div style={{ marginTop: 16 }}>
                  <div style={{ display: "flex", justifyContent: "flex-end", marginBottom: 8 }}>
                    <button onClick={function() { setAdminUnlocked(false); try { sessionStorage.removeItem("gp_admin_ok"); } catch (e) {} setAdminOpen(false); showToast("Admin locked"); }} className="active-scale" style={{ background: "transparent", color: "#888", border: "1px solid #444", padding: "6px 10px", borderRadius: 8, fontSize: 11, fontWeight: 700 }}>Lock admin</button>
                  </div>

                  <div style={{ background: "#000", border: "1px solid #fff", borderRadius: 12, padding: 14, marginBottom: 12 }}>
                    <div style={{ fontSize: 11, fontWeight: 900, color: "#fff", letterSpacing: 0.5, marginBottom: 10 }}>YOUR ACCOUNT</div>
                    <div style={{ fontSize: 12, color: "#ccc", lineHeight: 1.7 }}>
                      <div>Name: <span style={{ color: "#fff", fontWeight: 700 }}>{(profile && profile.name) ? profile.name : "—"}</span></div>
                      <div>Email: <span style={{ color: "#fff", fontWeight: 700 }}>{(profile && profile.email) ? profile.email : "—"}</span></div>
                      <div>Mobile: <span style={{ color: "#fff", fontWeight: 700 }}>{(profile && profile.mobile) ? profile.mobile : "—"}</span></div>
                      <div>Delivery: <span style={{ color: "#fff", fontWeight: 700 }}>{deliveryMode === "email" ? "Email only" : deliveryMode === "both" ? "App + Email" : "App inbox"}</span></div>
                      <div>Reports in inbox: <span style={{ color: "#fff", fontWeight: 700 }}>{inbox.length}</span></div>
                      <div>Favorites: <span style={{ color: "#fff", fontWeight: 700 }}>{favorites.length}/10</span></div>
                      <div>Mode: <span style={{ color: "#fff", fontWeight: 700 }}>{wsStatus === "live" ? "LIVE server" : wsStatus === "connecting" ? "Connecting…" : "LOCAL"}</span></div>
                      <div>Firebase: <span style={{ color: "#fff", fontWeight: 700 }}>{(typeof gpFirebaseStatus === "function" ? gpFirebaseStatus() : "offline")}</span></div>
                    </div>
                  </div>

                  <div style={{ background: "#000", border: "1px solid #fff", borderRadius: 12, padding: 14, marginBottom: 12 }}>
                    <div style={{ fontSize: 11, fontWeight: 900, color: "#fff", letterSpacing: 0.5, marginBottom: 8 }}>QUICK FOR YOU</div>
                    <div style={{ fontSize: 10, color: "#888", marginBottom: 10, lineHeight: 1.45 }}>Actions linked to your profile and mailbox on this device.</div>
                    <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8 }}>
                      <button onClick={function() { showToast("Generating GOLD…"); pushNewReport("XAUUSD"); }} className="active-scale" style={{ background: "#000", color: "#fff", border: "1px solid #fff", padding: 12, borderRadius: 8, fontWeight: 800, fontSize: 11 }}>Report GOLD</button>
                      <button onClick={function() { showToast("Generating WTI…"); pushNewReport("WTIUSD"); }} className="active-scale" style={{ background: "#000", color: "#fff", border: "1px solid #fff", padding: 12, borderRadius: 8, fontWeight: 800, fontSize: 11 }}>Report WTI</button>
                      <button onClick={function() { showToast("Hourly pair…"); pushHourlyPair(); }} className="active-scale" style={{ background: "#000", color: "#fff", border: "1px solid #fff", padding: 12, borderRadius: 8, fontWeight: 800, fontSize: 11 }}>Force hourly</button>
                      <button onClick={function() {
                        var to = (profile && profile.email) || "";
                        if (!to || to.indexOf("@") < 0) { showToast("Save email in Personal first"); return; }
                        if (!inbox.length) { showToast("No reports to email"); return; }
                        emailReport(inbox[0]);
                      }} className="active-scale" style={{ background: "#fff", color: "#000", border: "1px solid #fff", padding: 12, borderRadius: 8, fontWeight: 900, fontSize: 11 }}>Email latest</button>
                      <button onClick={function() { showToast("Toast OK"); try { playPatternBell(); } catch (e) {} }} className="active-scale" style={{ background: "#000", color: "#fff", border: "1px solid #fff", padding: 12, borderRadius: 8, fontWeight: 800, fontSize: 11 }}>Test toast</button>
                      <button onClick={function() {
                        ensureNotificationPermission().then(function(ok) {
                          if (ok) { gpNotify("Gold Pro", "Hello " + ((profile && profile.name) || "user"), "gp-test", { pattern: true }); showToast("Notification sent"); }
                          else showToast("Allow notifications in settings");
                        });
                      }} className="active-scale" style={{ background: "#000", color: "#fff", border: "1px solid #fff", padding: 12, borderRadius: 8, fontWeight: 800, fontSize: 11 }}>Test notify</button>
                    </div>
                  </div>

                  <div style={{ background: "#000", border: "1px solid #fff", borderRadius: 12, padding: 14, marginBottom: 12 }}>
                    <div style={{ fontSize: 11, fontWeight: 900, color: "#fff", letterSpacing: 0.5, marginBottom: 8 }}>FEATURES</div>
                    {[
                      { key: "hourlyReports", label: "Hourly GOLD + WTI", hint: "On the UTC hour" },
                      { key: "notifBell", label: "Notifications", hint: "Toasts + system alerts" },
                      { key: "sessionTicker", label: "Session ticker", hint: "Home strip" },
                      { key: "newsTicker", label: "Economy ticker", hint: "High impact" },
                      { key: "chartEmbed", label: "TradingView chart", hint: "Home chart" },
                      { key: "favorites", label: "Favorites grid", hint: "10 slots" },
                      { key: "autoSeed", label: "Seed empty inbox", hint: "First open" },
                      { key: "wsLive", label: "Live server feed", hint: "Optional WSS" }
                    ].map(function(row) {
                      var on = !!adminCfg[row.key];
                      return (
                        <div key={row.key} style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 10, padding: "10px 0", borderBottom: "1px solid #333" }}>
                          <div style={{ minWidth: 0 }}>
                            <div style={{ fontWeight: 700, fontSize: 12, color: "#fff" }}>{row.label}</div>
                            <div style={{ fontSize: 10, color: "#888" }}>{row.hint}</div>
                          </div>
                          <button onClick={function() { toggleAdmin(row.key); }} className="active-scale" style={{ minWidth: 56, padding: "8px 12px", borderRadius: 8, fontWeight: 900, fontSize: 11, background: on ? "#fff" : "#000", color: on ? "#000" : "#fff", border: "1px solid #fff" }}>{on ? "ON" : "OFF"}</button>
                        </div>
                      );
                    })}
                  </div>

                  <div style={{ background: "#000", border: "1px solid #fff", borderRadius: 12, padding: 14, marginBottom: 12 }}>
                    <div style={{ fontSize: 11, fontWeight: 900, color: "#fff", letterSpacing: 0.5, marginBottom: 8 }}>FCM · PATTERN PUSH ONLY</div>
                    <div style={{ fontSize: 10, color: "#888", marginBottom: 8, lineHeight: 1.45 }}>
                      Firebase Console → Project settings → Cloud Messaging → Web Push certificates → Key pair.
                      Alerts fire only for Prime Pattern plans — not 1h/4h reports.
                    </div>
                    <div style={{ fontSize: 10, color: "#888", marginBottom: 4 }}>VAPID key</div>
                    <input
                      id="gp_vapid_input"
                      defaultValue={(typeof GP_FCM_VAPID !== "undefined" && GP_FCM_VAPID) || ""}
                      placeholder="Paste Web Push key pair…"
                      style={{ width: "100%", boxSizing: "border-box", background: "#000", border: "1px solid #fff", borderRadius: 8, padding: "10px 12px", color: "#fff", fontSize: 11, marginBottom: 8, outline: "none" }}
                    />
                    <button
                      onClick={function() {
                        var el = document.getElementById("gp_vapid_input");
                        var v = el ? String(el.value || "").trim() : "";
                        try { localStorage.setItem("gp_fcm_vapid", v); } catch (e) {}
                        if (typeof GP_FCM_VAPID !== "undefined") { try { GP_FCM_VAPID = v; } catch (e2) {} }
                        showToast(v ? "VAPID saved · registering…" : "VAPID cleared");
                        if (v) {
                          gpRegisterFcm().then(function(tok) {
                            showToast(tok ? "FCM ready · patterns only" : "FCM register failed — check key / HTTPS");
                          });
                        }
                      }}
                      className="active-scale"
                      style={{ width: "100%", background: "#fff", color: "#000", border: "1px solid #fff", padding: 11, borderRadius: 8, fontWeight: 900, fontSize: 11, marginBottom: 8 }}
                    >Save VAPID + register FCM</button>
                    <div style={{ fontSize: 10, color: "#666" }}>Token: {(typeof gpFcmToken !== "undefined" && gpFcmToken) ? (String(gpFcmToken).slice(0, 24) + "…") : "not registered"}</div>
                  </div>
                  <div style={{ background: "#000", border: "1px solid #fff", borderRadius: 12, padding: 14, marginBottom: 12 }}>
                    <div style={{ fontSize: 11, fontWeight: 900, color: "#fff", letterSpacing: 0.5, marginBottom: 8 }}>CONNECTION (optional)</div>
                    <div style={{ fontSize: 10, color: "#888", marginBottom: 10, lineHeight: 1.5 }}>
                      Linked to <b style={{ color: "#fff" }}>{(profile && profile.email) || "your account"}</b>. App works in LOCAL mode without a server. Only turn WS on if you host a feed.
                    </div>
                    <div style={{ fontSize: 10, color: "#888", marginBottom: 4 }}>WebSocket URL</div>
                    <input value={adminWsInput} onChange={function(e) { setAdminWsInput(e.target.value); }} placeholder="wss://…" style={{ width: "100%", boxSizing: "border-box", background: "#000", border: "1px solid #fff", borderRadius: 8, padding: "10px 12px", color: "#fff", fontSize: 12, marginBottom: 8, outline: "none" }} />
                    <div style={{ fontSize: 10, color: "#888", marginBottom: 4 }}>API base</div>
                    <input value={adminApiInput} onChange={function(e) { setAdminApiInput(e.target.value); }} placeholder="https://…/api" style={{ width: "100%", boxSizing: "border-box", background: "#000", border: "1px solid #fff", borderRadius: 8, padding: "10px 12px", color: "#fff", fontSize: 12, marginBottom: 10, outline: "none" }} />
                    <div style={{ display: "flex", gap: 8 }}>
                      <button onClick={adminSaveEndpoints} className="active-scale" style={{ flex: 1, background: "#fff", color: "#000", border: "1px solid #fff", padding: 11, borderRadius: 8, fontWeight: 900, fontSize: 11 }}>Save</button>
                      <button onClick={adminReconnectWs} className="active-scale" style={{ flex: 1, background: "#000", color: "#fff", border: "1px solid #fff", padding: 11, borderRadius: 8, fontWeight: 800, fontSize: 11 }}>Reconnect</button>
                    </div>
                  </div>

                  <div style={{ background: "#000", border: "1px solid #fff", borderRadius: 12, padding: 14, marginBottom: 4 }}>
                    <div style={{ fontSize: 11, fontWeight: 900, color: "#fff", letterSpacing: 0.5, marginBottom: 8 }}>CLEAN YOUR DATA</div>
                    <div style={{ fontSize: 10, color: "#888", marginBottom: 10 }}>Only this device · linked to your saved profile</div>
                    <button onClick={function() { if (window.confirm("Delete all reports for this user on this device?")) { persistInbox([]); showToast("Inbox cleared"); } }} className="active-scale" style={{ width: "100%", background: "#000", color: "#fff", border: "1px solid #fff", padding: 12, borderRadius: 8, fontWeight: 800, fontSize: 12, marginBottom: 8 }}>Clear inbox ({inbox.length})</button>
                    <button onClick={function() { if (window.confirm("Clear favorites?")) { try { localStorage.removeItem("gp_fav10"); sessionStorage.removeItem("gp_fav10"); } catch (e) {} setFavorites([]); showToast("Favorites cleared"); } }} className="active-scale" style={{ width: "100%", background: "#000", color: "#fff", border: "1px solid #fff", padding: 12, borderRadius: 8, fontWeight: 800, fontSize: 12, marginBottom: 8 }}>Clear favorites ({favorites.length}/10)</button>
                    <button onClick={function() {
                      if (!window.confirm("Full reset for this device? Keep profile fields unless you clear them separately.")) return;
                      try {
                        ["gp_material_inbox","gp_fav10","gp_admin_cfg","gp_last_hourly_utc","gp_last_report_gen","gp_rate_us"].forEach(function(k) { try { localStorage.removeItem(k); } catch (e) {} });
                        try { sessionStorage.removeItem("gp_fav10"); } catch (e2) {}
                      } catch (e3) {}
                      persistInbox([]);
                      setFavorites([]);
                      saveAdminCfg({ hourlyReports: true, wsLive: false, notifBell: true, sessionTicker: true, newsTicker: true, chartEmbed: true, favorites: true, autoSeed: true, darkDefault: true });
                      showToast("Reset done");
                    }} className="active-scale" style={{ width: "100%", background: "#fff", color: "#000", border: "1px solid #fff", padding: 12, borderRadius: 8, fontWeight: 900, fontSize: 12 }}>Reset app data</button>
                  </div>

                </div>
              ) : null}
            </div>

            <div style={{ textAlign: "center", marginTop: 16, padding: 10 }}>
              <div style={{ fontSize: 10, color: "#555" }}>© 2026 Gold Pro • Dark Terminal • {currency.symbol}{currency.monthly}/{currency.symbol}{currency.yearly}</div>
            </div>
          </div>
        </div>

        {/* Bottom nav */}
        <div className="gp-bottom-nav" style={{ position: "fixed", bottom: 0, left: 0, right: 0, display: "flex", justifyContent: "space-around", padding: "8px 0 28px", zIndex: 99999, width: "100%" }}>
          <div style={{ display: "flex", justifyContent: "space-around", width: "100%", maxWidth: 560, margin: "0 auto" }}>
            {[{ id: "home", icon: "⌂", label: "Home" }, { id: "reports", icon: "📬", label: "Inbox" }, { id: "profile", icon: "👤", label: "Profile" }].map(function(item) {
              return (
                <button key={item.id} onClick={function() { setTab(item.id); }} className="active-scale" style={{ position: "relative", background: tab === item.id ? (appTheme === "dark" ? "rgba(255,255,255,0.05)" : "rgba(0,0,0,0.06)") : "transparent", border: tab === item.id ? ("1px solid " + (appTheme === "dark" ? "#fff" : "#111")) : "1px solid transparent", color: tab === item.id ? (appTheme === "dark" ? "#fff" : "#111") : (appTheme === "dark" ? "#888" : "#666"), fontWeight: 800, fontSize: 12, cursor: "pointer", display: "flex", flexDirection: "column", alignItems: "center", gap: 4, minWidth: 80, flex: 1, margin: "0 4px", minHeight: 70, padding: 12, borderRadius: 12 }}>
                  <span style={{ fontSize: 22 }}>{item.icon}</span>
                  {item.label}
                  {item.id === "reports" && inbox.length > 0 && (
                    <span style={{ position: "absolute", top: 8, right: "28%", background: "#b91c1c", color: "#fff", fontSize: 9, fontWeight: 900, minWidth: 16, height: 16, borderRadius: 8, display: "flex", alignItems: "center", justifyContent: "center", padding: "0 4px" }}>{inbox.length > 99 ? "99+" : inbox.length}</span>
                  )}
                </button>
              );
            })}
          </div>
        </div>

        {modal && (
          <div onClick={function(e) { if (e.target === e.currentTarget) setModal(null); }} style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.9)", backdropFilter: "blur(2px)", zIndex: 100001, display: "flex", alignItems: "flex-start", justifyContent: "center", padding: "max(12px, env(safe-area-inset-top)) 16px 24px", overflowY: "auto", WebkitOverflowScrolling: "touch" }}>
            <div onClick={function(e) { e.stopPropagation(); }} style={{ background: "#000", border: "2px solid #fff", borderRadius: 14, padding: 20, width: "100%", maxWidth: 420, marginTop: 12, marginBottom: 80 }}>
              <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 14 }}>
                <div style={{ fontWeight: 800 }}>{modal === "privacy" ? "Privacy Policy - UK GDPR" : modal === "terms" ? "Terms of Use" : modal === "contact" ? "Contact Us" : "About Gold Pro"}</div>
                <button onClick={function() { setModal(null); }} className="active-scale" style={{ background: "#000", border: "1px solid #fff", color: "#fff", padding: "8px 14px", borderRadius: 8, fontWeight: 700 }}>X</button>
              </div>
              {modal === "privacy" && (
                <div style={{ fontSize: 11, color: "#ccc", lineHeight: 1.55, whiteSpace: "pre-wrap", fontFamily: "ui-monospace, Menlo, monospace", maxHeight: "60vh", overflow: "auto" }}>{LEGAL_PRIVACY}</div>
              )}
              {modal === "terms" && (
                <div style={{ fontSize: 11, color: "#ccc", lineHeight: 1.55, whiteSpace: "pre-wrap", fontFamily: "ui-monospace, Menlo, monospace", maxHeight: "60vh", overflow: "auto" }}>{LEGAL_TERMS}</div>
              )}
              {modal === "about" && (
                <div style={{ fontSize: 12, color: "#ddd", textAlign: "center", lineHeight: 1.8 }}>
                  <img src={GP_LOGO} alt="Gold Pro" width={72} height={72} style={{ width: 72, height: 72, borderRadius: 16, objectFit: "cover", marginBottom: 12 }} />
                  <div style={{ fontWeight: 900, fontSize: 16, color: "#fff", marginBottom: 8 }}>Gold Pro</div>
                  <br />
                  • Material Reports every hour on the hour<br />
                  • Email-style Inbox with open / delete<br />
                  • Local storage • 30-day auto cleanup<br />
                  • TradingView live charts • MA50<br />
                  • English only interface<br />
                  © 2026 • Gold Pro
                </div>
              )}
              {modal === "contact" && (
                <div style={{ fontSize: 13, color: "#fff", lineHeight: 1.55 }}>
                  <div style={{ fontSize: 11, color: "#888", marginBottom: 14, lineHeight: 1.5 }}>
                    Contact support. Fill name & email below (saved to your device). Images optional (max 4MB).
                  </div>

                  <div style={{ marginBottom: 10 }}>
                    <div style={{ fontSize: 10, color: "#888", fontWeight: 700, marginBottom: 6 }}>NAME</div>
                    <input
                      type="text"
                      value={(profile && profile.name) || ""}
                      onChange={function(e) { setProfile(Object.assign({}, profile, { name: e.target.value })); }}
                      placeholder="Your name"
                      style={{ width: "100%", boxSizing: "border-box", background: "#000", border: "1px solid #fff", borderRadius: 10, padding: "12px 14px", color: "#fff", fontSize: 15, outline: "none", fontWeight: 600 }}
                    />
                  </div>
                  <div style={{ marginBottom: 10 }}>
                    <div style={{ fontSize: 10, color: "#888", fontWeight: 700, marginBottom: 6 }}>EMAIL</div>
                    <input
                      type="email"
                      value={(profile && profile.email) || ""}
                      onChange={function(e) { setProfile(Object.assign({}, profile, { email: e.target.value })); }}
                      placeholder="you@email.com"
                      style={{ width: "100%", boxSizing: "border-box", background: "#000", border: "1px solid #fff", borderRadius: 10, padding: "12px 14px", color: "#fff", fontSize: 15, outline: "none", fontWeight: 600 }}
                    />
                  </div>
                  <div style={{ marginBottom: 12 }}>
                    <div style={{ fontSize: 10, color: "#888", fontWeight: 700, marginBottom: 6 }}>MOBILE (optional)</div>
                    <input
                      type="tel"
                      value={(profile && profile.mobile) || ""}
                      onChange={function(e) { setProfile(Object.assign({}, profile, { mobile: e.target.value })); }}
                      placeholder="+44 …"
                      style={{ width: "100%", boxSizing: "border-box", background: "#000", border: "1px solid #fff", borderRadius: 10, padding: "12px 14px", color: "#fff", fontSize: 15, outline: "none", fontWeight: 600 }}
                    />
                  </div>

                  <div style={{ marginBottom: 12 }}>
                    <div style={{ fontSize: 10, color: "#888", fontWeight: 700, marginBottom: 6 }}>MESSAGE</div>
                    <textarea
                      value={contactMsg}
                      onChange={function(e) { setContactMsg(e.target.value); }}
                      placeholder="Describe your issue or question…"
                      rows={5}
                      style={{ width: "100%", boxSizing: "border-box", background: "#000", border: "1px solid #fff", borderRadius: 10, padding: 12, color: "#fff", fontSize: 14, fontFamily: "inherit", resize: "vertical", outline: "none" }}
                    />
                  </div>

                  <div style={{ marginBottom: 14 }}>
                    <div style={{ fontSize: 10, color: "#888", fontWeight: 700, marginBottom: 6 }}>IMAGE (optional)</div>
                    <label style={{ display: "block", background: "#000", border: "1px dashed #fff", borderRadius: 10, padding: "14px 12px", textAlign: "center", cursor: "pointer", marginBottom: 8 }}>
                      <div style={{ fontWeight: 800, fontSize: 13, color: "#fff" }}>{contactImg ? "Change image" : "Tap to add photo"}</div>
                      <div style={{ fontSize: 10, color: "#888", marginTop: 4 }}>Camera or gallery · images only</div>
                      <input
                        type="file"
                        accept="image/*"
                        capture="environment"
                        onChange={function(e) {
                          var f = e.target.files && e.target.files[0];
                          if (!f) { setContactImg(null); return; }
                          if (!f.type || f.type.indexOf("image/") !== 0) { showToast("Images only"); return; }
                          if (f.size > 4 * 1024 * 1024) { showToast("Image max 4MB"); return; }
                          var reader = new FileReader();
                          reader.onload = function() {
                            setContactImg({ name: f.name, dataUrl: reader.result, file: f, type: f.type });
                          };
                          reader.readAsDataURL(f);
                        }}
                        style={{ display: "none" }}
                      />
                    </label>
                    {contactImg ? (
                      <div style={{ background: "#000", border: "1px solid #fff", borderRadius: 10, padding: 10 }}>
                        <img src={contactImg.dataUrl} alt="preview" style={{ maxWidth: "100%", maxHeight: 160, borderRadius: 8, display: "block", margin: "0 auto" }} />
                        <div style={{ fontSize: 10, color: "#888", textAlign: "center", marginTop: 6 }}>{contactImg.name}</div>
                        <button onClick={function() { setContactImg(null); }} className="active-scale" style={{ display: "block", width: "100%", marginTop: 8, background: "#000", color: "#fff", border: "1px solid #fff", padding: "8px 10px", borderRadius: 8, fontSize: 11, fontWeight: 800 }}>Remove image</button>
                      </div>
                    ) : null}
                  </div>

                  <button
                    onClick={function() {
                      if (window.__gpContactSending) {
                        showToast("Already opening mail…");
                        return;
                      }
                      var name = (profile && profile.name) || "";
                      var email = (profile && profile.email) || "";
                      var mobile = (profile && profile.mobile) || "";
                      if (!email || email.indexOf("@") < 0) {
                        showToast("Enter your email above first");
                        return;
                      }
                      if (!(contactMsg || "").trim()) {
                        showToast("Write a message first");
                        return;
                      }
                      window.__gpContactSending = true;
                      try { localStorage.setItem("gp_profile", JSON.stringify(profile)); } catch (eP) {}
                      var textBody =
                        "Name: " + name + "\n" +
                        "Email: " + email + "\n" +
                        "Mobile: " + mobile + "\n\n" +
                        "Message:\n" + contactMsg.trim();
                      var subject = "Gold Pro Contact — " + (name || "User");
                      var mailBody = textBody + (contactImg ? "\n\n[Please attach the image if needed: " + (contactImg.name || "photo") + "]" : "");
                      var mailUrl = "mailto:sabaghb@hotmail.com?subject=" + encodeURIComponent(subject) + "&body=" + encodeURIComponent(mailBody);

                      /* Prefer mailto only (user gesture). Avoid navigator.share — it can re-open / stick on some phones. */
                      try {
                        if (contactImg && contactImg.dataUrl) {
                          try {
                            var aImg = document.createElement("a");
                            aImg.href = contactImg.dataUrl;
                            aImg.download = contactImg.name || "goldpro-support.jpg";
                            document.body.appendChild(aImg);
                            aImg.click();
                            document.body.removeChild(aImg);
                          } catch (eDl) {}
                        }
                        var a = document.createElement("a");
                        a.href = mailUrl;
                        a.style.display = "none";
                        document.body.appendChild(a);
                        a.click();
                        document.body.removeChild(a);
                        showToast("Opening mail app…");
                        setContactMsg("");
                        setContactImg(null);
                        setModal(null);
                      } catch (err) {
                        showToast("Could not open email app");
                      }
                      setTimeout(function() { window.__gpContactSending = false; }, 2500);
                    }}
                    className="active-scale"
                    style={{ width: "100%", background: "#fff", color: "#000", border: "1px solid #fff", padding: 14, borderRadius: 10, fontWeight: 900, fontSize: 14 }}
                  >Send to support</button>
                  <div style={{ fontSize: 10, color: "#888", marginTop: 10, textAlign: "center", lineHeight: 1.45 }}>
                    To: sabaghb@hotmail.com · Message required · Image optional
                  </div>
                </div>
              )}
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(
  React.createElement(React.StrictMode, null, React.createElement(App, null))
);
  </script>
</body>
</html>
