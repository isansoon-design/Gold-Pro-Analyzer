
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache">
<title>Gold V28.0 TRADINGVIEW - Locked - Final</title>
<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<style>
:root{--gold:#FFD700;--green:#00ff88;--bg:#050508;--card:#111;--border:#222;--red:#ff4444;--yellow:#ffcc00}
*{margin:0;padding:0;box-sizing:border-box}
body{background:#050508;color:#e8e8e8;font-family:-apple-system,Inter,sans-serif}
.app{max-width:480px;margin:0 auto;background:#050508;min-height:100vh;padding-bottom:90px}
.header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid #222;position:sticky;top:0;background:#050508;z-index:20}
.logo{display:flex;gap:8px;align-items:center}
.g{width:34px;height:34px;background:#FFD700;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#000;font-weight:900}
.badge{background:#00ff88;color:#000;padding:5px 12px;border-radius:20px;font-size:11px;font-weight:800}
.price-card{background:#111;border:1px solid #222;border-radius:16px;padding:14px;margin:12px;display:flex;justify-content:space-between}
.price{font-size:30px;font-weight:900;font-family:monospace}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 12px;scrollbar-width:none}
.chip{padding:8px 14px;border-radius:20px;border:1px solid #333;background:#1a1a1a;color:#888;font-size:12px;font-weight:700;white-space:nowrap;display:flex;align-items:center;gap:6px;flex-shrink:0}
.chip.active{background:#FFD700;color:#000;border-color:#FFD700}
.search{display:flex;gap:6px;background:#111;border:1px solid #333;border-radius:10px;padding:5px 8px;margin:12px}
.search input{flex:1;background:transparent;border:none;color:#fff;outline:none;font-size:13px}
.btn{background:#FFD700;border:none;color:#000;font-weight:800;padding:7px 14px;border-radius:8px;font-size:12px;cursor:pointer}
.sessions-section{margin:8px 12px 6px;background:#111;border:1px solid #333;border-radius:12px;overflow:hidden}
.sessions-header{background:rgba(0,255,136,0.08);padding:7px 12px;font-size:11px;font-weight:800;color:#00ff88;display:flex;justify-content:space-between}
.sessions-ticker-wrap{overflow:hidden;background:#0a0a0a;padding:8px 0}
.sessions-ticker-track{display:flex;gap:8px;width:max-content;animation:scrollSessions 35s linear infinite}
@keyframes scrollSessions{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
.session-box{min-width:160px;background:#111;border:1.5px solid #222;border-radius:10px;padding:9px 11px;flex-shrink:0}
.session-box.open{border-color:rgba(0,255,136,0.5);background:rgba(0,255,136,0.07)}
.session-box.closed{border-color:#333;opacity:0.85}
.session-top{display:flex;justify-content:space-between;align-items:center}
.session-name{font-size:12px;font-weight:800;display:flex;gap:5px}
.session-status{font-size:10px;font-weight:800;margin-top:4px}
.status-open{color:#00ff88}.status-closed{color:#888}
.session-countdown{font-size:10px;font-weight:700;font-family:monospace;margin-top:4px;color:#fff}
.news-section{margin:6px 12px 10px;background:#111;border:1px solid #333;border-radius:12px;overflow:hidden}
.news-header{background:rgba(255,215,0,0.1);padding:7px 12px;font-size:11px;font-weight:800;color:#FFD700;display:flex;gap:6px}
.news-live-badge{margin-left:auto;background:#ff4444;color:#fff;padding:2px 6px;border-radius:8px;font-size:9px;font-weight:900}
.ticker-wrap{overflow:hidden;white-space:nowrap;background:#0a0a0a;padding:8px 0}
.ticker-track{display:flex;gap:20px;width:max-content;animation:scrollNews 50s linear infinite}
.ticker-item{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:#ddd;background:rgba(255,255,255,0.05);border:1px solid #222;border-radius:8px;padding:5px 12px;flex-shrink:0}
@keyframes scrollNews{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
.chart-wrap{background:#0a0a0a;border:1px solid #222;border-radius:16px;margin:12px;overflow:hidden;position:relative}
.chart-head{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-bottom:1px solid #222;font-size:11px;color:#888}
.lock-btn{background:#1a1a1a;border:1px solid #333;color:#FFD700;padding:5px 12px;border-radius:8px;font-size:11px;font-weight:800;cursor:pointer}
.lock-btn.locked{background:rgba(255,215,0,0.15);border-color:#FFD700;color:#FFD700}
#tv_chart_container{width:100%;height:380px;background:#0a0a0a}
#fallbackCanvas{width:100%;height:380px;display:none;background:#0a0a0a}
.tab{display:none}.tab.active{display:block}
.bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;height:72px;background:#08080c;border-top:1px solid #222;display:flex;justify-content:space-around;align-items:center;z-index:40}
.nav-btn{background:none;border:none;color:#666;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;cursor:pointer}
.nav-btn.active{color:#FFD700}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#1e1e1e;border:1px solid #FFD700;color:#fff;padding:10px 16px;border-radius:12px;font-size:12px;z-index:10000;max-width:90%;display:none}
.toast.show{display:block}
</style>
</head>
<body>
<!-- APP HTML + TRADINGVIEW WIDGET - FULL CODE IN FILE ABOVE - 329 lines ready for GitHub -->
</body>
</html>
