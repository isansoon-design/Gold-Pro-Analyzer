function detectCurrency() {
  try {
    const lang = (navigator.language || "en-US").toLowerCase();
    const tz = Intl.DateTimeFormat().resolvedOptions().timeZone || "";
    if (lang.startsWith("en-gb") || tz.includes("London") || tz === "Europe/London")

  } catch {}

function utcMinutes() {
  const d = new Date();
  return d.getUTCHours() * 60 + d.getUTCMinutes();

function sessionStatus(s, now) {
  const openM = s.open * 60, closeM = s.close * 60;
  if (closeM < openM) {
    if (now >= openM || now < closeM) return "open";
    let left = openM - now; if (left < 0) left += 1440;
    return left <= 30 ? "soon" : "closed";
  }
  if (now >= openM && now < closeM) return "open";
  let left = openM - now; if (left < 0) left += 1440;
  return left <= 30 ? "soon" : "closed";
}

function minsToClose(s, now) {
  const closeM = s.close * 60, openM = s.open * 60;
  if (closeM < openM) {
    if (now >= openM) return 1440 - now + closeM;
    return closeM - now;
  }
  return closeM - now;
}

function minsToOpen(openH, now) {
  let r = openH * 60 - now;
  if (r < 0) r += 1440;
  return r;
}

function fmtMins(m) {
  const h = Math.floor(m / 60), mm = m % 60;
  return h > 0 ? `${h}h ${String(mm).padStart(2, "0")}m` : `${mm}m`;
}

function normalizeSymbol(raw) {
  let s = (raw || "").toUpperCase().replace(/[\/\s_]/g, "");

  if (s === "APPLE") s = "AAPL";
  if (s === "SILVER") s = "XAGUSD";
  if (s === "BITCOIN") s = "BTCUSD";
  if (s === "EURIPY") s = "EURJPY";
  return s || "XAUUSD";
}

function downloadText(filename, text, mime) {
  const blob = new Blob([text], { type: mime || "text/plain" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function formatReportStamp(ts) {

  return { date: date, time: time, full: date + " • " + time };
}

async function fetchCandles(symbol, tf) {
  const tdInterval = { "1": "1min", "30": "30min", "60": "1h", "240": "4h", D: "1day" };
  const bnInterval = { "1": "1m", "30": "30m", "60": "1h", "240": "4h", D: "1d" };
  const pair = DISPLAY[symbol] || (symbol.slice(0, 3) + "/" + symbol.slice(3)) || symbol;
  const bnSym = BINANCE_MAP[symbol] || "BTCUSDT";
  try {
    const url = "https://api.twelvedata.com/time_series?symbol=" + encodeURIComponent(pair) + "&interval=" + (tdInterval[tf] || "30min") + "&outputsize=120&apikey=demo";
    const res = await fetch(url);
    if (res.ok) {
      const data = await res.json();
      if (data && Array.isArray(data.values) && data.values.length > 50) {
        return data.values.reverse().map(function(v) {
          return { open: parseFloat(v.open), high: parseFloat(v.high), low: parseFloat(v.low), close: parseFloat(v.close) };
        });
      }
    }
  } catch (e) {}
  try {
    const url = "https://api.binance.com/api/v3/klines?symbol=" + bnSym + "&interval=" + (bnInterval[tf] || "30m") + "&limit=120";
    const res = await fetch(url);
    if (res.ok) {
      const data = await res.json();
      if (Array.isArray(data) && data.length > 50) {
        return data.map(function(c) {
          return { open: parseFloat(c[1]), high: parseFloat(c[2]), low: parseFloat(c[3]), close: parseFloat(c[4]) };
        });
      }
    }
  } catch (e) {}
  const seed = symbol.split("").reduce(function(a, c) { return a + c.charCodeAt(0); }, 0);
  var price = 2000 + (seed % 200);
  if (symbol.indexOf("WTI") >= 0 || symbol.indexOf("OIL") >= 0) price = 80 + (seed % 20);
  if (symbol.indexOf("EUR") >= 0 || symbol.indexOf("GBP") >= 0) price = 1.05 + (seed % 30) / 100;
  if (symbol.indexOf("BTC") >= 0) price = 60000 + (seed % 5000);
  if (symbol === "AAPL" || symbol === "APPLE") price = 180 + (seed % 40);
  var out = [];
  for (var i = 0; i < 120; i++) {
    var d = (Math.sin(i + seed) + (Math.random() - 0.5)) * (price * 0.002);
    price += d;
    var o = price, cl = price + (Math.random() - 0.5) * (price * 0.0015);
    out.push({ open: o, close: cl, high: Math.max(o, cl) + Math.random() * (price * 0.001), low: Math.min(o, cl) - Math.random() * (price * 0.001) });
  }
  return out;
}

function sma(candles, period) {
  var out = [];
  for (var i = 0; i < candles.length; i++) {
    if (i < period - 1) { out.push(null); continue; }
    var sum = 0;
    for (var j = i - period + 1; j <= i; j++) sum += candles[j].close;
    out.push(sum / period);
  }
  return out;
}

function buildAnalysis(symbol, trend, support, resistance, price) {

async function generateServerReport(material, profile, reportNumber) {
  var symbol = normalizeSymbol(material);
  var candles = await fetchCandles(symbol, "30");
  var last = candles[candles.length - 1];
  var closes = candles.map(function(c) { return c.close; });
  var recent = closes.slice(-20);
  var avg = recent.reduce(function(a, b) { return a + b; }, 0) / recent.length;
  var priceNum = last ? last.close : avg;
  var high20 = Math.max.apply(null, candles.slice(-20).map(function(c) { return c.high; }));
  var low20 = Math.min.apply(null, candles.slice(-20).map(function(c) { return c.low; }));
  var decimals = priceNum > 50 ? 2 : 4;
  var support = (low20 * 0.998).toFixed(decimals);
  var resistance = (high20 * 1.002).toFixed(decimals);
  var ma50 = sma(candles, 50);
  var lastMa = ma50[ma50.length - 1];
  var trend = "Neutral ◆";
  if (lastMa != null) {
    if (priceNum > lastMa * 1.002) trend = "Bullish ▲";
    else if (priceNum < lastMa * 0.998) trend = "Bearish ▼";
  } else {
    var slope = recent[recent.length - 1] - recent[0];
    if (slope > 0) trend = "Bullish ▲";
    else if (slope < 0) trend = "Bearish ▼";
  }
  var seed = Date.now() + symbol.charCodeAt(0);
  var news = {};
  NEWS_SOURCES.forEach(function(src, i) {
    news["news" + (i + 1)] = pickNewsLine(src, seed + i * 17);
  });
  var priceStr = pricePrefix(symbol) + Number(priceNum).toFixed(decimals);
  var analysis = buildAnalysis(symbol, trend, support, resistance, priceStr);
  var summary = buildSummary(symbol, trend, support, resistance);
  var now = Date.now();
  var stamp = formatReportStamp(now);
  return Object.assign({
    id: "rpt_" + now + "_" + symbol,
    createdAt: now,
    expiry: now + THIRTY_DAYS,
    material: symbol,
    displayName: DISPLAY[symbol] || symbol,
    dateLabel: stamp.date,
    timeLabel: stamp.time,
    stampFull: stamp.full,
    username: (profile && profile.name) ? profile.name : "Prime User",
    user_email: (profile && profile.email) ? profile.email : "user@goldpro.com",
    report_count: reportNumber,
    price: priceStr,
    trend: trend,
    support: support,
    resistance: resistance,
    analysis: analysis,
    summary: summary
  }, news);
}

}

                        <span>{n.title}</span>
                        <span style={{ fontSize: 9, background: "#1a0a0a", border: "1px solid #b91c1c", color: "#b91c1c", padding: "2px 8px", borderRadius: 999, display: "inline-flex", alignItems: "center", fontWeight: 800 }}>
                          <span style={{ width: 6, height: 6, background: "#b91c1c", borderRadius: "50%", display: "inline-block", marginRight: 4 }} />HIGH
                        </span>
                      </span>
                      <span style={{ color: "#333", fontSize: 14 }}>•</span>
                    </React.Fragment>
                  );
                })}
              </div>
            </div>
          </div>

          <div style={{ background: "#0b0e11", border: "1px solid #2a2a2a", borderRadius: 14, margin: 8, padding: 12, display: "flex", gap: 6 }}>
            <input value={addInput} onChange={function(e) { setAddInput(e.target.value); }} onKeyDown={function(e) { if (e.key === "Enter") { selectSymbol(addInput); setAddInput(""); } }} placeholder="XAU, WTI, AAPL, GBPUSD..." style={{ flex: 1, minWidth: 0, background: "#000", border: "1px solid #333", borderRadius: 8, padding: 14, color: "#fff", outline: "none", fontSize: 16, fontWeight: 700 }} />
            <button onClick={function() { if (!addInput.trim()) { showToast("Enter symbol: XAU, WTI, AAPL..."); return; } selectSymbol(addInput); setAddInput(""); showToast("Added " + normalizeSymbol(addInput) + " to watchlist"); }} className="active-scale" style={{ background: "transparent", color: "#fff", border: "1px solid #fff", padding: "0 18px", borderRadius: 8, fontWeight: 900, minHeight: 48 }}>ADD</button>
            <button onClick={resetWatchlist} className="active-scale" style={{ background: "#fff", color: "#000", border: "1px solid #fff", padding: "0 18px", borderRadius: 8, fontWeight: 900, minHeight: 48 }}>Reset</button>
          </div>

          <div style={{ padding: "0 10px" }}>
            <div style={{ fontSize: 9, color: "#666", fontWeight: 800, margin: "6px 0 6px 4px" }}>Watchlist • Tap symbol • Tap X to delete</div>
            <div style={{ display: "flex", flexWrap: "wrap", gap: 4 }}>
              {watchlist.map(function(s) {
                return (
                  <div key={s} style={{ display: "inline-flex", alignItems: "center", gap: 4, border: s === active ? "1px solid #fff" : "1px solid #444", background: s === active ? "#fff" : "transparent", borderRadius: 999, padding: "4px 6px 4px 12px", margin: 4 }}>
                    <button onClick={function() { setActive(s); showToast(s + " selected • REAL LIVE PRICE"); }} style={{ background: "transparent", border: "none", fontWeight: 800, fontSize: 12, cursor: "pointer", padding: 4, color: s === active ? "#000" : "#fff" }}>{s}</button>
                    <button onClick={function() { removeSymbol(s); }} className="active-scale" style={{ background: "#222", color: "#fff", border: "1px solid #555", borderRadius: "50%", width: 22, height: 22, fontWeight: 900, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 12 }}>✕</button>
                  </div>
                );
              })}
            </div>
          </div>

          <div style={{ padding: "6px 10px", display: "flex", flexWrap: "wrap", gap: 4 }}>
            {TIMEFRAMES.map(function(t) {
              return (
                <button key={t} onClick={function() { setTf(t); showToast("Timeframe " + (t === "D" ? "1D" : t + "m") + " selected"); }} className="active-scale" style={{ border: t === tf ? "1px solid #fff" : "1px solid #444", background: t === tf ? "#fff" : "transparent", color: t === tf ? "#000" : "#fff", padding: "10px 14px", borderRadius: 999, fontSize: 12, fontWeight: 800, margin: 4 }}>{t === "D" ? "1D" : t + "m"}</button>
              );
            })}
          </div>

          <div style={{ background: "#000", border: "2px solid #fff", borderRadius: 14, margin: 8, overflow: "hidden" }}>
            <div style={{ padding: "6px 10px", display: "flex", justifyContent: "space-between", borderBottom: "1px solid #222" }}>
              <span style={{ fontSize: 9, fontWeight: 800 }}>{active} • REAL LIVE PRICE • Dark Terminal</span>
              <span style={{ fontSize: 8, color: "#15803d", fontWeight: 800 }}>● LIVE</span>
            </div>
            <div style={{ height: 110, display: "flex", alignItems: "center", justifyContent: "center", background: "#000" }}>
              {online
                ? <iframe src={miniUrl} style={{ width: "100%", height: "100%", border: 0, background: "#000" }} loading="lazy" title="price" />
                : <div style={{ fontSize: 10, color: "#666", fontWeight: 700 }}>Live price offline preview • {active}</div>}
            </div>
          </div>

          <div style={{ background: "#0b0e11", border: "1px solid #2a2a2a", borderRadius: 14, margin: 8, overflow: "hidden" }}>
            <div style={{ padding: "6px 10px", background: "#000", borderBottom: "1px solid #222", display: "flex", justifyContent: "space-between" }}>
              <span style={{ fontSize: 10, fontWeight: 800 }}>{active} • Chart • MA50=50 ONLY • Real • {tf === "D" ? "1D" : tf + "m"}</span>
              <span style={{ fontSize: 8, color: "#666", fontWeight: 700 }}>{tvSymbol}</span>
            </div>
            <div style={{ height: 360, background: "#000", display: "flex", alignItems: "center", justifyContent: "center" }}>
              {online
                ? <iframe src={chartUrl} style={{ width: "100%", height: "100%", border: 0 }} loading="lazy" title="chart" />
                : <div style={{ textAlign: "center", padding: 24 }}>
                    <div style={{ fontWeight: 800, fontSize: 14, marginBottom: 4 }}>{active} Chart • MA50=50</div>
                    <div style={{ fontSize: 10, color: "#666" }}>Offline preview – TradingView loads when online</div>
                  </div>}
            </div>
          </div>
        </div>

        {/* INBOX */}
        <div style={{ display: tab === "reports" ? "block" : "none", paddingBottom: 180 }}>
          <div style={{ padding: "16px 16px 8px", display: "flex", justifyContent: "space-between", alignItems: "flex-start", gap: 8 }}>
            <div>
              <div style={{ fontWeight: 800, fontSize: 18 }}>Inbox</div>
              <div style={{ fontSize: 10, color: "#666" }}>Material Reports • Updated every 30 minutes • {inbox.length} message{inbox.length === 1 ? "" : "s"}</div>
            </div>
            <button onClick={function() { pushNewReport(active); }} disabled={reportGenerating} className="active-scale" style={{ background: "transparent", color: "#fff", border: "1px solid #fff", padding: "8px 12px", borderRadius: 8, fontWeight: 800, fontSize: 11, opacity: reportGenerating ? 0.5 : 1, flexShrink: 0 }}>{reportGenerating ? "..." : "Refresh"}</button>
          </div>

          <div style={{ margin: "8px 8px 0", padding: "10px 12px", borderRadius: 12, background: "#0b0e11", border: "1px solid #2a2a2a", fontSize: 11, color: "#888" }}>
            📨 Live WebSocket feed when connected. Server pushes one report every 30 minutes to all clients. Local fallback runs only if WS is offline. Auto-delete after 30 days.
          </div>

          <div style={{ margin: "8px 8px 0", padding: 12, borderRadius: 12, background: "#0b0e11", border: "1px solid #2a2a2a" }}>
            <div style={{ fontSize: 10, color: "#888", fontWeight: 800, marginBottom: 6 }}>WebSocket Server URL</div>
            <div style={{ display: "flex", gap: 6 }}>
              <input
                value={wsUrl}
                onChange={function(e) { setWsUrl(e.target.value); }}
                placeholder="wss://api.goldpro.uk/ws/reports"
                style={{ flex: 1, minWidth: 0, background: "#000", border: "1px solid #333", borderRadius: 8, padding: "10px 12px", color: "#fff", outline: "none", fontSize: 12, fontWeight: 600 }}
              />
              <button
                onClick={function() {
                  try { localStorage.setItem("gp_ws_url", wsUrl); } catch (e) {}
                  showToast("WebSocket URL saved • reconnecting");
                  // force reconnect by rewriting URL state slightly then back
                  setWsUrl(wsUrl);
                }}
                className="active-scale"
                style={{ background: "#fff", color: "#000", border: "1px solid #fff", padding: "0 14px", borderRadius: 8, fontWeight: 900, fontSize: 11 }}
              >Save</button>
            </div>
            <div style={{ fontSize: 10, color: "#666", marginTop: 6 }}>Status: {wsStatus === "live" ? "Connected (LIVE)" : wsStatus === "connecting" ? "Connecting..." : "Offline / reconnecting"}</div>
          </div>

          <div style={{ margin: "8px 8px 0", padding: 12, borderRadius: 12, background: "#0b0e11", border: "1px solid #2a2a2a" }}>
            <div style={{ fontSize: 10, color: "#888", fontWeight: 800, marginBottom: 6 }}>Search Reports by Material</div>
            <div style={{ display: "flex", gap: 6 }}>
              <input
                value={reportSearch}
                onChange={function(e) { setReportSearch(e.target.value); }}
                onKeyDown={function(e) {
                  if (e.key === "Enter") {
                    var s = normalizeSymbol(reportSearch);
                    if (!s) { showToast("Enter a material to search"); return; }
                    setReportSearch(s);
                    showToast("Generating report for " + s + "...");
                    pushNewReport(s);
                  }
                }}
                placeholder="Search material: XAUUSD, WTI, EURUSD, GOLD..."
                style={{ flex: 1, minWidth: 0, background: "#000", border: "1px solid #333", borderRadius: 8, padding: "12px 14px", color: "#fff", outline: "none", fontSize: 14, fontWeight: 700 }}
              />
              <button
                onClick={function() {
                  var s = normalizeSymbol(reportSearch);
                  if (!s) { showToast("Enter a material to search"); return; }
                  setReportSearch(s);
                  showToast("Generating report for " + s + "...");
                  pushNewReport(s);
                }}
                className="active-scale"
                style={{ background: "#fff", color: "#000", border: "1px solid #fff", padding: "0 16px", borderRadius: 8, fontWeight: 900, fontSize: 12, minHeight: 44 }}
              >Search</button>
              {reportSearch ? (
                <button
                  onClick={function() { setReportSearch(""); showToast("Search cleared"); }}
                  className="active-scale"
                  style={{ background: "transparent", color: "#fff", border: "1px solid #444", padding: "0 12px", borderRadius: 8, fontWeight: 900, fontSize: 12, minHeight: 44 }}
                >Clear</button>
              ) : null}
            </div>
            <div style={{ display: "flex", flexWrap: "wrap", gap: 6, marginTop: 8 }}>
              {["XAUUSD", "WTIUSD", "EURUSD", "GBPUSD", "BTCUSD", "AAPL", "USDJPY", "XAGUSD"].map(function(sym) {
                var activeChip = reportSearch.toUpperCase().replace(/[\/\s_]/g, "") === sym;
                return (
                  <button
                    key={sym}
                    onClick={function() { setReportSearch(sym); showToast("Filter: " + sym); }}
                    className="active-scale"
                    style={{
                      background: activeChip ? "#fff" : "transparent",
                      color: activeChip ? "#000" : "#fff",
                      border: activeChip ? "1px solid #fff" : "1px solid #444",
                      padding: "6px 10px", borderRadius: 999, fontSize: 11, fontWeight: 800
                    }}
                  >{sym}</button>
                );
              })}
            </div>
            <div style={{ fontSize: 10, color: "#666", marginTop: 6 }}>
              {reportSearch
                ? ("Showing " + filteredInbox.length + " of " + inbox.length + " reports")
                : (inbox.length + " reports in inbox")}
            </div>
          </div>

          {inbox.length === 0 ? (
            <div style={{ padding: 40, textAlign: "center", color: "#555", fontSize: 13 }}>
              No reports yet<br />
              <span style={{ fontSize: 11 }}>New Material Reports arrive every 30 minutes</span>
            </div>
          ) : filteredInbox.length === 0 ? (
            <div style={{ padding: 40, textAlign: "center", color: "#555", fontSize: 13 }}>
              No reports found for "{reportSearch}"<br />
              <span style={{ fontSize: 11 }}>Try another material or clear the search</span>
              <div style={{ marginTop: 12 }}>
                <button
                  onClick={function() {
                    var s = normalizeSymbol(reportSearch);
                    if (!s) return;
                    pushNewReport(s);
                    showToast("Requesting report for " + s);
                  }}
                  className="active-scale"
                  style={{ background: "#fff", color: "#000", border: "1px solid #fff", padding: "10px 16px", borderRadius: 8, fontWeight: 900, fontSize: 12 }}
                >Request report for {normalizeSymbol(reportSearch) || "material"}</button>
              </div>
            </div>
          ) : (
            <div style={{ margin: 8, borderRadius: 14, overflow: "hidden", border: "1px solid #2a2a2a", background: "#0b0e11" }}>
              {filteredInbox.map(function(item, idx) {
                return (
                  <button key={item.id} onClick={function() { setOpenReportId(item.id); }} style={{ width: "100%", textAlign: "left", background: idx % 2 === 0 ? "#0b0e11" : "#0a0a0a", border: "none", borderBottom: idx < filteredInbox.length - 1 ? "1px solid #222" : "none", padding: "14px 14px", color: "#fff", cursor: "pointer", display: "flex", gap: 12, alignItems: "center" }}>
                    <div style={{ width: 42, height: 42, borderRadius: 10, background: "#111", border: "1px solid #333", display: "flex", alignItems: "center", justifyContent: "center", fontWeight: 900, fontSize: 11, flexShrink: 0 }}>{item.material.slice(0, 3)}</div>
                    <div style={{ flex: 1, minWidth: 0 }}>
                      <div style={{ display: "flex", justifyContent: "space-between", gap: 8, marginBottom: 2 }}>
                        <div style={{ fontWeight: 800, fontSize: 13, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{item.material}</div>
                        <div style={{ fontSize: 10, color: "#888", flexShrink: 0 }}>{item.timeLabel}</div>
                      </div>
                      <div style={{ fontSize: 11, color: "#aaa", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{item.trend} • {item.price} • S {item.support} / R {item.resistance}</div>
                      <div style={{ fontSize: 10, color: "#666", marginTop: 2 }}>{item.dateLabel} • Report #{item.report_count}</div>
                    </div>
                    <div style={{ color: "#666", fontSize: 18, flexShrink: 0 }}>›</div>
                  </button>
                );
              })}
            </div>
          )}
        </div>

        {/* PROFILE */}
        <div style={{ display: tab === "profile" ? "block" : "none", paddingBottom: 180 }}>
          <div style={{ padding: 16, maxWidth: 480, margin: "0 auto" }}>
            <div style={{ fontWeight: 800, fontSize: 20, marginBottom: 6 }}>Profile - Dark Terminal</div>
            <div style={{ fontSize: 10, color: "#666", marginBottom: 14 }}>Full Profile: Name Mobile Email + {currency.symbol}{currency.monthly}/{currency.symbol}{currency.yearly}</div>

            <div style={{ background: "#0b0e11", border: "1px solid #2a2a2a", borderRadius: 12, padding: 14, marginBottom: 14 }}>
              <div style={{ fontWeight: 800, marginBottom: 12 }}>Personal Information</div>
              <input value={profile.name} onChange={function(e) { setProfile(Object.assign({}, profile, { name: e.target.value })); }} placeholder="Full Name" type="text" style={{ width: "100%", background: "#000", border: "1px solid #333", borderRadius: 10, padding: 16, color: "#fff", marginBottom: 12, fontSize: 16, outline: "none" }} />
              <input value={profile.mobile} onChange={function(e) { setProfile(Object.assign({}, profile, { mobile: e.target.value })); }} placeholder="Mobile Number" type="tel" style={{ width: "100%", background: "#000", border: "1px solid #333", borderRadius: 10, padding: 16, color: "#fff", marginBottom: 12, fontSize: 16, outline: "none" }} />
              <input value={profile.email} onChange={function(e) { setProfile(Object.assign({}, profile, { email: e.target.value })); }} placeholder="Email Address" type="email" style={{ width: "100%", background: "#000", border: "1px solid #333", borderRadius: 10, padding: 16, color: "#fff", marginBottom: 12, fontSize: 16, outline: "none" }} />
              <button onClick={saveProfile} className="active-scale" style={{ width: "100%", background: "transparent", color: "#fff", border: "1px solid #fff", padding: 16, borderRadius: 8, fontWeight: 900 }}>Save Profile</button>
            </div>

            <div style={{ background: "#0b0e11", border: "2px solid #fff", borderRadius: 12, padding: 14, marginBottom: 14 }}>
              <div style={{ fontWeight: 800, marginBottom: 12 }}>Subscription - {currency.symbol}{currency.monthly} Monthly / {currency.symbol}{currency.yearly} Yearly</div>
              <div onClick={function() { setBilling("monthly"); }} style={{ borderRadius: 12, padding: 12, marginBottom: 8, cursor: "pointer", border: billing === "monthly" ? "2px solid #fff" : "1px solid #2a2a2a", background: billing === "monthly" ? "#111" : "#0b0e11" }}>
                <div style={{ display: "flex", justifyContent: "space-between" }}>
                  <div>
                    <div style={{ fontWeight: 800 }}>Pro Monthly <span style={{ background: "#fff", color: "#000", padding: "2px 6px", borderRadius: 10, fontSize: 8, marginLeft: 4 }}>Popular</span></div>
                    <div style={{ fontSize: 10, color: "#888", marginTop: 2 }}>Unlimited Material Reports + High Impact Calendar</div>
                  </div>
                  <div style={{ textAlign: "right" }}>
                    <div style={{ fontWeight: 900, fontSize: 18 }}>{currency.symbol}{currency.monthly}</div>
                    <div style={{ fontSize: 10, color: "#888" }}>/mo</div>
                  </div>
                </div>
              </div>
              <div onClick={function() { setBilling("yearly"); }} style={{ borderRadius: 12, padding: 12, marginBottom: 8, cursor: "pointer", border: billing === "yearly" ? "2px solid #fff" : "1px solid #2a2a2a", background: billing === "yearly" ? "#111" : "#0b0e11" }}>
                <div style={{ display: "flex", justifyContent: "space-between" }}>
                  <div>
                    <div style={{ fontWeight: 800 }}>Pro Yearly - Save {currency.symbol}{savings}</div>
                    <div style={{ fontSize: 10, color: "#888", marginTop: 2 }}>All Pro + Priority Support</div>
                  </div>
                  <div style={{ textAlign: "right" }}>
                    <div style={{ fontWeight: 900, fontSize: 18 }}>{currency.symbol}{currency.yearly}</div>
                    <div style={{ fontSize: 10, color: "#888" }}>/year</div>
                  </div>
                </div>
              </div>
              <button onClick={function() { showToast("Subscribe " + currency.symbol + currency.monthly + " Monthly"); }} className="active-scale" style={{ width: "100%", background: "transparent", color: "#fff", border: "1px solid #fff", padding: 14, borderRadius: 8, fontWeight: 900, marginTop: 10 }}>Subscribe {currency.symbol}{currency.monthly} Monthly - Popular</button>
              <button onClick={function() { showToast("Subscribe " + currency.symbol + currency.yearly + " Yearly"); }} className="active-scale" style={{ width: "100%", background: "#fff", color: "#000", border: "1px solid #fff", padding: 14, borderRadius: 8, fontWeight: 900, marginTop: 8 }}>Subscribe {currency.symbol}{currency.yearly} Yearly - Best Value</button>
            </div>

            <div style={{ background: "#0b0e11", border: "1px solid #2a2a2a", borderRadius: 12, padding: 14 }}>
              <div style={{ fontWeight: 800, marginBottom: 12 }}>Legal & Support</div>
              {[{ key: "privacy", icon: "🔒", title: "Privacy Policy", sub: "UK GDPR - Data protection" }, { key: "terms", icon: "📄", title: "Terms of Use", sub: "Terms & Conditions - Analyzer only" }, { key: "about", icon: "G", title: "About Gold Pro", sub: "Dark Terminal • Material Reports", white: true }].map(function(item, idx) {
                return (
                  <div key={item.key} onClick={function() { setModal(item.key); }} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "16px 0", borderBottom: idx < 2 ? "1px solid #222" : "none", cursor: "pointer" }}>
                    <div style={{ display: "flex", gap: 10, alignItems: "center" }}>
                      <div style={{ background: item.white ? "#fff" : "#1a1d23", color: item.white ? "#000" : "#fff", width: 36, height: 36, borderRadius: 8, display: "flex", alignItems: "center", justifyContent: "center", fontWeight: 900 }}>{item.icon}</div>
                      <div>
                        <div style={{ fontWeight: 700 }}>{item.title}</div>
                        <div style={{ fontSize: 10, color: "#888" }}>{item.sub}</div>
                      </div>
                    </div>
                    <span style={{ fontSize: 20 }}>›</span>
                  </div>
                );
              })}
            </div>

            <div style={{ textAlign: "center", marginTop: 16, padding: 10 }}>
              <div style={{ fontSize: 10, color: "#555" }}>© 2025 Gold Pro • Dark Terminal • {currency.symbol}{currency.monthly}/{currency.symbol}{currency.yearly}</div>
            </div>
          </div>
        </div>

        {/* Bottom nav */}
        <div style={{ position: "fixed", bottom: 0, left: 0, right: 0, background: "#0b0e11", borderTop: "2px solid #fff", display: "flex", justifyContent: "space-around", padding: "8px 0 28px", zIndex: 99999, width: "100%" }}>
          <div style={{ display: "flex", justifyContent: "space-around", width: "100%", maxWidth: 560, margin: "0 auto" }}>
            {[{ id: "home", icon: "⌂", label: "Home" }, { id: "reports", icon: "📬", label: "Inbox" }, { id: "profile", icon: "👤", label: "Profile" }].map(function(item) {
              return (
                <button key={item.id} onClick={function() { setTab(item.id); }} className="active-scale" style={{ position: "relative", background: tab === item.id ? "rgba(255,255,255,0.05)" : "transparent", border: tab === item.id ? "1px solid #fff" : "1px solid transparent", color: tab === item.id ? "#fff" : "#888", fontWeight: 800, fontSize: 11, cursor: "pointer", display: "flex", flexDirection: "column", alignItems: "center", gap: 4, minWidth: 80, flex: 1, margin: "0 4px", minHeight: 70, padding: 12, borderRadius: 12 }}>
                  <span style={{ fontSize: 22 }}>{item.icon}</span>
                  {item.label}
                  {item.id === "reports" && inbox.length > 0 && (
                    <span style={{ position: "absolute", top: 8, right: "28%", background: "#b91c1c", color: "#fff", fontSize: 9, fontWeight: 900, minWidth: 16, height: 16, borderRadius: 8, display: "flex", alignItems: "center", justifyContent: "center", padding: "0 4px" }}>{inbox.length > 99 ? "99+" : inbox.length}</span>
                  )}
                </button>
              );
            })}
          </div>
        </div>

        {modal && (
          <div onClick={function(e) { if (e.target === e.currentTarget) setModal(null); }} style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.9)", backdropFilter: "blur(2px)", zIndex: 100001, display: "flex", alignItems: "center", justifyContent: "center", padding: 20 }}>
            <div style={{ background: "#0b0e11", border: "2px solid #fff", borderRadius: 14, padding: 20, width: "100%", maxWidth: 420, maxHeight: "85vh", overflowY: "auto" }}>
              <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 14 }}>
                <div style={{ fontWeight: 800 }}>{modal === "privacy" ? "Privacy Policy - UK GDPR" : modal === "terms" ? "Terms of Use" : "About Gold Pro"}</div>
                <button onClick={function() { setModal(null); }} className="active-scale" style={{ background: "transparent", border: "1px solid #444", color: "#fff", padding: "8px 14px", borderRadius: 8, fontWeight: 700 }}>X</button>
              </div>
              {modal === "privacy" && (
                <div style={{ fontSize: 12, color: "#ddd", lineHeight: 1.6 }}>
                  Dark Terminal - Privacy Policy<br /><br />
                  <b>Data Collected:</b> Full Name, Mobile Number, Email Address.<br />
                  <b>Usage:</b> Account management, subscription {currency.symbol}{currency.monthly}/{currency.symbol}{currency.yearly}.<br />
                  <b>Storage:</b> Reports stored locally on device only.<br />
                  <b>No Sharing:</b> Never sell data.<br />
                  <b>Rights:</b> Access, delete, export.<br /><br />
                  Contact: privacy@goldpro.uk
                </div>
              )}
              {modal === "terms" && (
                <div style={{ fontSize: 12, color: "#ddd", lineHeight: 1.6 }}>
                  Dark Terminal - Terms of Use<br /><br />
                  <b>1. Analyzer Only:</b> Not financial advice.<br />
                  <b>2. Subscription:</b> {currency.symbol}{currency.monthly} Monthly / {currency.symbol}{currency.yearly} Yearly.<br />
                  <b>3. Material Reports:</b> Generated on a 30-minute cadence and delivered to your local inbox. Display only.<br />
                  <b>4. Risk:</b> Trading involves risk.<br />
                </div>
              )}
              {modal === "about" && (
                <div style={{ fontSize: 12, color: "#ddd", textAlign: "center", lineHeight: 1.8 }}>
                  Gold Pro - Dark Terminal<br />White & Black Edition<br /><br />
                  • Material Reports every 30 minutes<br />
                  • Email-style Inbox with open / delete<br />
                  • Local storage • 30-day auto cleanup<br />
                  • TradingView live charts • MA50<br />
                  • English only interface<br />
                  © 2025 • Gold Pro
                </div>
              )}
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(
  React.createElement(React.StrictMode, null, React.createElement(App, null))
);
  </script>
</body>
</html>
