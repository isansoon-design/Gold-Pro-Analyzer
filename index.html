function tvSymbolFor(material) {
  var m = normalizeSymbol(material || "") || String(material || "").toUpperCase();
  if (TV_SYMBOLS[m]) return TV_SYMBOLS[m];
  if (m.indexOf("XAU") >= 0 || m === "GOLD") return "OANDA:XAUUSD";
  if (m.indexOf("XAG") >= 0 || m === "SILVER") return "TVC:SILVER";
  if (m.indexOf("WTI") >= 0 || m.indexOf("OIL") >= 0) return "FX:USOIL";
  if (m.indexOf("BTC") >= 0) return "BINANCE:BTCUSDT";
  if (m === "EURUSD" || (m.indexOf("EUR") >= 0 && m.indexOf("USD") >= 0)) return "OANDA:EURUSD";
  if (m === "GBPUSD" || (m.indexOf("GBP") >= 0 && m.indexOf("USD") >= 0)) return "OANDA:GBPUSD";
  if (m === "USDJPY") return "OANDA:USDJPY";
  if (m === "GBPJPY") return "OANDA:GBPJPY";
  if (m === "EURJPY") return "OANDA:EURJPY";
  if (m.indexOf("AAPL") >= 0 || m === "APPLE") return "NASDAQ:AAPL";
  return "OANDA:XAUUSD";
}

function downloadText(filename, text, mime) {
  const blob = new Blob([text], { type: mime || "text/plain" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function formatReportStamp(ts) {
  const d = new Date(ts);
  const date = d.toUTCString().slice(5, 16);
  const time = String(d.getUTCHours()).padStart(2, "0") + ":" + String(d.getUTCMinutes()).padStart(2, "0") + " UTC";
  return { date: date, time: time, full: date + " • " + time };
}

function pricePrefix(symbol) {

  return "";
}

/* Live mid price from the SAME TradingView symbol used by the chart — keeps banner = chart */
async function fetchTvLivePrice(symbol) {
  var tv = tvSymbolFor(symbol);
  function parseTvJson(d) {
    if (!d || d.code) return null;
    var lp = null;
    if (d.lp != null && isFinite(Number(d.lp)) && Number(d.lp) > 0) lp = Number(d.lp);
    else if (d.bid != null && d.ask != null && isFinite(Number(d.bid)) && isFinite(Number(d.ask))) lp = (Number(d.bid) + Number(d.ask)) / 2;
    else if (d.bid != null && isFinite(Number(d.bid)) && Number(d.bid) > 0) lp = Number(d.bid);
    else if (d.ask != null && isFinite(Number(d.ask)) && Number(d.ask) > 0) lp = Number(d.ask);
    if (!(lp > 0)) return null;
    var chp = (d.chp != null && isFinite(Number(d.chp))) ? Number(d.chp) : null;
    var ch = (d.ch != null && isFinite(Number(d.ch))) ? Number(d.ch) : null;
    return { price: lp, changePct: chp, change: ch, source: "tradingview", tvSymbol: tv };
  }
  /* 1) TradingView scanner — same family as chart widget */
  var fields = "lp,bid,ask,ch,chp,open_price,prev_close_price,description";
  var urls = [
    "https://scanner.tradingview.com/symbol?symbol=" + encodeURIComponent(tv) + "&fields=" + fields,
    "https://scanner.tradingview.com/symbol?symbol=" + encodeURIComponent(tv) + "&fields=lp,bid,ask,chp"
  ];
  for (var u = 0; u < urls.length; u++) {
    try {
      var res = await fetch(urls[u], { method: "GET", cache: "no-store", mode: "cors" });
      if (res.ok) {
        var d = await res.json();
        var parsed = parseTvJson(d);
        if (parsed) return parsed;
      }
    } catch (e) {}
  }
  /* 2) Own backend proxy (if you add /api/quote on goldproanalyzer.com) — same numbers as chart when wired */
  try {
    var api = (typeof API_BASE !== "undefined" ? API_BASE : "") + "/quote?symbol=" + encodeURIComponent(tv);
    var res2 = await fetch(api, { method: "GET", cache: "no-store" });
    if (res2.ok) {
      var d2 = await res2.json();
      var p2 = null;
      if (d2 && d2.price != null) p2 = Number(d2.price);
      else if (d2 && d2.lp != null) p2 = Number(d2.lp);
      else if (d2 && d2.data && d2.data.lp != null) p2 = Number(d2.data.lp);
      if (p2 > 0) {
        return {
          price: p2,
          changePct: d2.changePct != null ? Number(d2.changePct) : (d2.chp != null ? Number(d2.chp) : null),
          change: d2.change != null ? Number(d2.change) : null,
          source: "tradingview",
          tvSymbol: tv
        };
      }
    }
  } catch (eApi) {}
  return null;
}

function aggregateTo4h(rows) {
  if (!rows || rows.length < 4) return rows || [];
  var out = [];
  var bucket = null;
  function bucketKey(tMs) {
    var d = new Date(tMs);
    var h = d.getUTCHours();
    var slot = Math.floor(h / 4) * 4;
    return Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate(), slot, 0, 0, 0);
  }
  for (var i = 0; i < rows.length; i++) {
    var c = rows[i];
    var tMs = c.t;
    if (tMs == null) continue;
    if (tMs < 1e12) tMs = tMs * 1000;
    var key = bucketKey(tMs);
    if (!bucket || bucket.key !== key) {
      if (bucket) out.push(bucket.bar);
      bucket = {
        key: key,
        bar: { t: key, open: c.open, high: c.high, low: c.low, close: c.close }
      };
    } else {
      bucket.bar.high = Math.max(bucket.bar.high, c.high);
      bucket.bar.low = Math.min(bucket.bar.low, c.low);
      bucket.bar.close = c.close;
    }
  }
  if (bucket) out.push(bucket.bar);
  return out;
}

var __gpCandleCache = {};
async function fetchCandles(symbol, tf) {
  var ref = REF_PRICE[symbol] || 100;
  var ySym = YAHOO_SYMBOL[symbol];
  var cacheKey = String(symbol || "") + "|" + String(tf || "30");
  try {
    var hit = __gpCandleCache[cacheKey];
    if (hit && hit.rows && hit.rows.length > 10 && (Date.now() - hit.t) < 90000) {
      return hit.rows;
    }
  } catch (eC0) {}

  async function parseYahoo(url) {
    var yRes = await fetch(url);
    if (!yRes.ok) throw new Error("yahoo http");
    var yData = await yRes.json();
    var result = yData.chart.result[0];
    var q = result.indicators.quote[0];
    var ts = (result.timestamp || []);
    var rows = [];
    for (var i = 0; i < q.close.length; i++) {
      if (q.close[i] == null || q.open[i] == null) continue;
      rows.push({
        open: q.open[i], high: q.high[i], low: q.low[i], close: q.close[i],
        t: (ts[i] != null ? ts[i] * 1000 : null)
      });
    }
    return rows;
  }

  if (ySym) {
    var tfL = String(tf || "30").toLowerCase();
    var yInterval = "30m";
    var yRange = "5d";
    if (tfL.indexOf("4") >= 0 || tfL === "240" || tfL === "4h") {
      yInterval = "60m";
      yRange = "14d"; /* faster load · enough for 4h structure + MA50 */
    } else if (tfL.indexOf("1h") >= 0 || tfL === "60") {
      yInterval = "60m";
      yRange = "10d";
    }
    var urls = [
      "https://query1.finance.yahoo.com/v8/finance/chart/" + encodeURIComponent(ySym) + "?interval=" + yInterval + "&range=" + yRange,
      "https://query2.finance.yahoo.com/v8/finance/chart/" + encodeURIComponent(ySym) + "?interval=" + yInterval + "&range=" + yRange
    ];
    for (var u = 0; u < urls.length; u++) {
      try {
        var rows = await parseYahoo(urls[u]);
        if (rows.length > 10) {
          var lastC = rows[rows.length - 1].close;
          if (!ref || (lastC > ref * 0.35 && lastC < ref * 2.8)) {
            rows._source = "yahoo";
            try { __gpCandleCache[cacheKey] = { t: Date.now(), rows: rows }; } catch (eC1) {}
            return rows;
          }
        }
      } catch (eY) {}
      /* CORS proxy fallback for file:// / strict browsers */
      try {
        var proxied = "https://api.allorigins.win/raw?url=" + encodeURIComponent(urls[u]);
        var rowsP = await parseYahoo(proxied);
        if (rowsP.length > 10) {
          rowsP._source = "yahoo-proxy";
          try { __gpCandleCache[cacheKey] = { t: Date.now(), rows: rowsP }; } catch (eC2) {}
          return rowsP;
        }
      } catch (eP) {}
    }
  }

  var bnSym = BINANCE_MAP[symbol];
  if (bnSym) {
    try {
      var bnUrl = "https://api.binance.com/api/v3/klines?symbol=" + bnSym + "&interval=30m&limit=120";
      var bnRes = await fetch(bnUrl);
      if (bnRes.ok) {
        var bnData = await bnRes.json();
        if (bnData.length > 20) {
          var mapped = bnData.map(function(k) {
            return { open: parseFloat(k[1]), high: parseFloat(k[2]), low: parseFloat(k[3]), close: parseFloat(k[4]), t: parseFloat(k[0]) };
          });
          mapped._source = "binance";
          return mapped;
        }
      }
    } catch (e2) {}
  }

  /* Anchor synthetic path to TradingView live price when possible */
  var live = null;
  try { live = await fetchTvLivePrice(symbol); } catch (eL) { live = null; }
  var price = (live && live.price > 0) ? live.price : ref;
  if (!(price > 0)) price = 100;
  var out = [];
  var now = Date.now();
  var vol = price >= 50 ? price * 0.0012 : price * 0.0009;
  var px = price * 0.997;
  for (var k = 0; k < 96; k++) {
    var noise = (Math.random() - 0.48) * vol;
    var o = px;
    px = px + noise;
    if (px < price * 0.985) px = price * 0.985;
    if (px > price * 1.015) px = price * 1.015;
    var cl = px;
    var hi = Math.max(o, cl) + Math.abs(noise) * 0.6;
    var lo = Math.min(o, cl) - Math.abs(noise) * 0.6;
    out.push({ open: o, high: hi, low: lo, close: cl, t: now - (96 - k) * 30 * 60 * 1000 });
  }
  /* end near live price */
  var last = out[out.length - 1];
  last.close = price;
  last.high = Math.max(last.high, price);
  last.low = Math.min(last.low, price);
  out._source = "anchored-fallback";
  return out;
}

function sma(candles, period) {
  var out = [];
  for (var i = 0; i < candles.length; i++) {
    if (i < period - 1) { out.push(null); continue; }
    var sum = 0;
    for (var j = i - period + 1; j <= i; j++) sum += candles[j].close;
    out.push(sum / period);
  }
  return out;
}

  if (symbol === "WTIUSD" || symbol === "WTI") alts = alts.concat(["CL=F", "BZ=F"]);
  if (symbol === "XAGUSD" || symbol === "SILVER") alts = alts.concat(["SI=F"]);
  /* unique */
  alts = alts.filter(function(v, i, a) { return v && a.indexOf(v) === i; });
  function parseYahooChart(data) {
    try {
      var result = data.chart.result[0];
      var q = result.indicators.quote[0];
      var ts = result.timestamp || [];
      var rows = [];
      for (var i = 0; i < q.close.length; i++) {
        if (q.close[i] == null || q.high[i] == null || q.low[i] == null) continue;
        rows.push({ t: (ts[i] || 0) * 1000, open: q.open[i], high: q.high[i], low: q.low[i], close: q.close[i] });
      }
      return rows;
    } catch (e) { return []; }
  }
  var hosts = ["https://query1.finance.yahoo.com", "https://query2.finance.yahoo.com"];
  var ranges = [
    { interval: "1wk", range: "5y" },
    { interval: "1wk", range: "2y" },

  ];
  for (var a = 0; a < alts.length; a++) {
    for (var h = 0; h < hosts.length; h++) {
      for (var r = 0; r < ranges.length; r++) {
        try {
          var url = hosts[h] + "/v8/finance/chart/" + encodeURIComponent(alts[a]) + "?interval=" + ranges[r].interval + "&range=" + ranges[r].range;
          var res = await fetch(url, { cache: "no-store" });
          if (!res.ok) continue;
          var data = await res.json();
          var rows = parseYahooChart(data);
          if (rows.length > 20) return rows;
        } catch (eTry) {}
      }
    }
  }
  return [];
}

function fmtLevelDate(ms) {
  if (!ms) return "—";
  try {
    var d = new Date(ms);
    return d.toUTCString().slice(5, 16);
  } catch (e) { return "—"; }
}

/* Count historical tests of support/resistance over weekly bars (lookback ~2–5y) */
function analyzeLevelMemory(weekly, support, resistance, priceNum, meta) {
  var s = parseFloat(support);
  var r = parseFloat(resistance);
  var p = Number(priceNum);
  var empty = {
    lookbackYears: 0, bars: 0,
    supportTests: 0, resistanceTests: 0,
    supportDates: [], resistanceDates: [],
    rangeLow: null, rangeHigh: null, trendSlope: "flat",
    dataQuality: "none",
    note: "No verified weekly history — test counts withheld."
  };
  meta = meta || {};
  /* Reject synthetic short-horizon bars (inflates tests to nonsense like 80x same week) */
  if (meta.synthetic) return empty;
  if (!weekly || !weekly.length || !(p > 0)) return empty;
  var span = 0;
  if (weekly[0].t && weekly[weekly.length - 1].t) {
    span = weekly[weekly.length - 1].t - weekly[0].t;
  }
  /* Need at least ~6 months of real history */
  if (span < 180 * 24 * 3600 * 1000) {
    return Object.assign({}, empty, {
      bars: weekly.length,
      dataQuality: "short",
      note: "History window too short for reliable multi-year level tests."
    });
  }
  /* Tighter band: gold ~0.15% (~$6 at 4000) — not 0.4% which counts almost every bar */
  var tol = p >= 500 ? p * 0.0015 : (p >= 50 ? p * 0.0025 : p * 0.0012);
  var sWeeks = {};
  var rWeeks = {};
  var sTouches = [];
  var rTouches = [];
  var minL = Infinity, maxH = -Infinity;
  var first = weekly[0].close, last = weekly[weekly.length - 1].close;
  for (var i = 0; i < weekly.length; i++) {
    var bar = weekly[i];
    if (bar.low < minL) minL = bar.low;
    if (bar.high > maxH) maxH = bar.high;
    var weekKey = "";
    try {
      var d = new Date(bar.t);
      weekKey = d.getUTCFullYear() + "-W" + Math.floor((d.getUTCMonth() * 30 + d.getUTCDate()) / 7);
    } catch (eK) { weekKey = String(bar.t); }
    /* Touch = bar traded through the level (high/low spans it) */
    if (isFinite(s) && bar.low <= s && bar.high >= s) {
      if (!sWeeks[weekKey]) {
        sWeeks[weekKey] = true;
        sTouches.push(bar.t);
      }
    }
    if (isFinite(r) && bar.low <= r && bar.high >= r) {
      if (!rWeeks[weekKey]) {
        rWeeks[weekKey] = true;
        rTouches.push(bar.t);
      }
    }
  }
  var years = span / (365.25 * 24 * 3600 * 1000);
  var slope = last > first * 1.03 ? "up" : last < first * 0.97 ? "down" : "flat";
  /* If >35% of weekly bars "touch" the level, level is just near the whole sample median — not a documented S/R memory */
  var maxMeaningful = Math.max(5, Math.floor(weekly.length * 0.5));
  var sCount = sTouches.length;
  var rCount = rTouches.length;
  /* Always show real counts when > 0; only hide if absurdly noisy */
  var sValid = sCount > 0 && sCount <= maxMeaningful;
  var rValid = rCount > 0 && rCount <= maxMeaningful;
  return {
    lookbackYears: Math.round(years * 10) / 10,
    bars: weekly.length,
    supportTests: sValid ? sCount : (sCount > 0 ? Math.min(sCount, maxMeaningful) : 0),
    resistanceTests: rValid ? rCount : (rCount > 0 ? Math.min(rCount, maxMeaningful) : 0),
    supportDates: sTouches.length ? sTouches.slice(-12).reverse().map(fmtLevelDate) : [],
    resistanceDates: rTouches.length ? rTouches.slice(-12).reverse().map(fmtLevelDate) : [],
    rangeLow: isFinite(minL) ? minL : null,
    rangeHigh: isFinite(maxH) ? maxH : null,
    trendSlope: slope,
    dataQuality: "weekly",
    source: "Yahoo Finance weekly (GC=F / CL=F etc.)",
    note: sValid || rValid
      ? ("Documented: distinct calendar weeks where weekly bar traded through the level. Source: Yahoo weekly history ~" + (Math.round(years * 10) / 10) + "y. Not a trade signal.")
      : ("Level sits inside common price area of the sample — historical touch count not shown (would be noise, not documentation).")
  };
}

/* MODULE 1 — MA50 Two-Candle Structure */
function detectMA50Structure(candles, ma50, priceNum) {
  if (!candles || candles.length < 10 || !ma50) return null;
  var n = candles.length;
  var last = candles[n - 1];
  var lastMa = ma50[n - 1];
  if (lastMa == null || !(priceNum > 0)) return null;
  var above = priceNum > lastMa;
  var bullCloses = [];
  var bearCloses = [];
  for (var i = Math.max(0, n - 30); i < n; i++) {
    if (ma50[i] == null) continue;
    var c = candles[i];
    if (gpIsBull(c) && Number(c.close) > ma50[i]) bullCloses.push(i);
    if (gpIsBear(c) && Number(c.close) < ma50[i]) bearCloses.push(i);
  }
  if (above && bullCloses.length >= 2) {
    /* Guide: two closed bullish candles above MA50 (not required consecutive) + price above MA50 */
    var crossedUp = false;
    for (var j = Math.max(1, n - 60); j < n; j++) {
      if (ma50[j - 1] != null && ma50[j] != null) {
        if (Number(candles[j - 1].close) <= Number(ma50[j - 1]) && Number(candles[j].close) > Number(ma50[j])) {
          crossedUp = true; break;
        }
      }
    }
    /* Also accept: last 2 closed candles both bullish and both fully above MA50 */
    var c1 = candles[n - 1], c2 = candles[n - 2];
    var ma1 = ma50[n - 1], ma2 = ma50[n - 2];
    var twoAbove = (
      ma1 != null && ma2 != null &&
      gpIsBull(c1) && gpIsBull(c2) &&
      Number(c1.close) > Number(ma1) && Number(c1.open) > Number(ma1) &&
      Number(c2.close) > Number(ma2) && Number(c2.open) > Number(ma2)
    );
    if (crossedUp || twoAbove || (bullCloses.length >= 2 && priceNum > lastMa)) {
      return {
        module: "ma50",
        bias: "bullish",
        stars: 1,
        title: "MA50 Structure",
        detail: "Two closed candles above MA50. Price context: Currently above 50-period average.",
        notifyBody: "MA50 Structure: Two closed candles above MA50.\nPrice context: Currently above 50-period average."
      };
    }
  }
  if (!above && bearCloses.length >= 2) {
    var crossedDown = false;
    for (var k = Math.max(1, n - 40); k < n; k++) {
      if (ma50[k - 1] != null && ma50[k] != null) {
        if (candles[k - 1].close > ma50[k - 1] && candles[k].close < ma50[k]) { crossedDown = true; break; }
      }
    }
    if (crossedDown || (bearCloses.length >= 3 && priceNum < lastMa * 0.9995)) {
      return {
        module: "ma50",
        bias: "bearish",
        stars: 1,
        title: "MA50 Structure",
        detail: "Two closed candles below MA50. Price context: Currently below 50-period average.",
        notifyBody: "MA50 Structure: Two closed candles below MA50.\nPrice context: Currently below 50-period average."
      };
    }
  }
  return null;
}

/* MODULE 2 — Engulfing Candle Structure */
function detectEngulfing(candles, ma50, priceNum) {
  if (!candles || candles.length < 8) return null;
  var n = candles.length;
  var cur = candles[n - 1];
  var prev = candles[n - 2];
  var lastMa = ma50 && ma50[n - 1];

  var curBody = gpBody(cur);
  var prevBody = gpBody(prev);

  if (above && gpIsBear(cur)) {

      module: "engulfing",
      bias: "bearish",
      stars: 1,
      ratio: Math.round(ratio * 10) / 10,
      title: "Engulfing Structure",

}

function detectDynamicCluster(candles, priceNum) {

  var closes = [];
  var start = Math.max(0, candles.length - 100);
  for (var i = start; i < candles.length; i++) {

  if (closes.length < 20) return null;
  var tol = priceNum * 0.02;
  var bestCount = 0;
  var bestLevel = null;
  for (var a = 0; a < closes.length; a++) {
    var lvl = closes[a];
    var cnt = 0;
    for (var b = 0; b < closes.length; b++) {

  var isSupport = priceNum >= bestLevel;

function getFibFallback(candles, currentPrice) {

/** Stable S/R via swing clustering (0.2% bins) + Fib fallback */
function getStableSR(candles, currentPrice) {
  if (!candles || candles.length < 20 || !(currentPrice > 0)) {

  }
  var slice = candles.slice(-150);

  var i, j;

      if (slice[i].low >= slice[i - j].low || slice[i].low >= slice[i + j].low) isTrough = false;
    }
    if (isPeak) peaks.push(slice[i].high);
    if (isTrough) troughs.push(slice[i].low);
  }
  var binSize = currentPrice * 0.002;
  function cluster(values) {
    if (!values.length) return [];
    var sorted = values.slice().sort(function(a, b) { return a - b; });
    var clusters = [], current = [sorted[0]];
    for (var k = 1; k < sorted.length; k++) {
      if (sorted[k] - current[0] <= binSize) current.push(sorted[k]);
      else {
        clusters.push(current);
        current = [sorted[k]];
      }
    }
    if (current.length) clusters.push(current);
    clusters.sort(function(a, b) { return b.length - a.length; });
    return clusters.map(function(c) {

      return { level: s / c.length, count: c.length };

  var support = null, resistance = null, si, ri;

  peakClusters.sort(function(a, b) { return b.count - a.count; });
  for (si = 0; si < troughClusters.length; si++) {
    if (troughClusters[si].level < currentPrice) { support = troughClusters[si].level; break; }
  }
  for (ri = 0; ri < peakClusters.length; ri++) {
    if (peakClusters[ri].level > currentPrice) { resistance = peakClusters[ri].level; break; }
  }
  if (support == null && troughClusters.length) support = troughClusters[0].level;
  if (resistance == null && peakClusters.length) resistance = peakClusters[0].level;

  if (!support || !resistance || (resistance - support) < currentPrice * 0.003) {
    return getFibFallback(candles, currentPrice);

function srPickFromSwings(rows, current) {
  /* Locked: last 10 closed lows / last 6 closed highs */
  if (!rows || rows.length < 5 || !(current > 0)) {
    var gap0 = (current > 0 ? current : 1) * 0.004;
    return {
      support: { price: current - gap0, type: "support", strength: 2, touches: 1 },
      resistance: { price: current + gap0, type: "resistance", strength: 2, touches: 1 },
      source: "fallback"
    };
  }
  /* Drop forming bar so USER/TRIAL match on same closed data */
  var closed = rows.length > 2 ? rows.slice(0, -1) : rows;
  var windowLows = closed.slice(-10);
  var windowHighs = closed.slice(-6);
  var highestHigh = -Infinity;
  var lowestLow = Infinity;
  var i;
  for (i = 0; i < windowLows.length; i++) {
    if (windowLows[i].low < lowestLow) lowestLow = windowLows[i].low;
  }
  for (i = 0; i < windowHighs.length; i++) {
    if (windowHighs[i].high > highestHigh) highestHigh = windowHighs[i].high;
  }
  if (!isFinite(highestHigh) || !isFinite(lowestLow)) {
    var gap1 = current * 0.004;
    return {
      support: { price: current - gap1, type: "support", strength: 2, touches: 1 },
      resistance: { price: current + gap1, type: "resistance", strength: 2, touches: 1 },
      source: "fallback"
    };
  }
  var support = lowestLow;
  var resistance = highestHigh;
  if (support >= current) support = current * 0.9985;
  if (resistance <= current) resistance = current * 1.0015;
  var minGap = current * 0.003;
  if (resistance - support < minGap) {
    var halfGap = minGap / 2;
    support = current - halfGap;
    resistance = current + halfGap;
  }
  var maxOffset = current * 0.02;
  if (support < current - maxOffset) support = current - maxOffset;
  if (resistance > current + maxOffset) resistance = current + maxOffset;
  support = Math.round(support * 100) / 100;
  resistance = Math.round(resistance * 100) / 100;
  return {
    support: { price: support, type: "support", strength: 3, touches: 2 },
    resistance: { price: resistance, type: "resistance", strength: 3, touches: 2 },
    source: "last10S+last6R"
  };
}

/* System notification — pattern alerts are #1 product channel (toast + OS push + SW) */
async function gpNotify(title, body, tag, extra) {
  extra = extra || {};
  var ok = false;
  try {
    /* Sound: church bell (0.5s) */
    try { playPatternBell(); } catch (eS) {}
    if (typeof Notification === "undefined") return false;
    if (Notification.permission === "default") {
      try { await Notification.requestPermission(); } catch (e) {}
    }
    if (Notification.permission !== "granted") return false;
    var isPat = !!extra.pattern;
    var opts = {
      body: (body || "").toString().slice(0, 180),
      tag: tag || (isPat ? ("gp-pattern-" + Date.now()) : ("gp-" + Date.now())),
      renotify: true,
      requireInteraction: isPat,
      silent: false,
      vibrate: isPat ? [220, 80, 220, 80, 220] : [120, 60, 120],
      badge: (typeof GP_LOGO !== "undefined" ? GP_LOGO : undefined),
      icon: (typeof GP_LOGO !== "undefined" ? GP_LOGO : undefined),
      data: {
        source: "goldpro",
        material: extra.material || "",
        reportId: extra.reportId || "",
        pattern: isPat,
        url: extra.url || (typeof location !== "undefined" ? location.href.split("#")[0] : "/")
      }
    };
    /* 1) Service Worker first — better for background / lock screen on mobile */
    if (navigator.serviceWorker) {
      try {
        var reg = await Promise.race([
          navigator.serviceWorker.ready,
          new Promise(function(r) { setTimeout(function() { r(null); }, 2500); })
        ]);
        if (reg && reg.showNotification) {
          await reg.showNotification(title || "Gold Pro · Pattern", opts);
          ok = true;
        } else if (reg && reg.active) {
          reg.active.postMessage({
            type: "gp-notify",
            title: title || "Gold Pro · Pattern",
            body: opts.body,
            tag: opts.tag,
            pattern: isPat,
            material: extra.material || "",
            reportId: extra.reportId || "",
            url: opts.data.url
          });
          ok = true;
        }
      } catch (e1) {}
    }
    /* 2) Page Notification — foreground reliability */
    try {
      var n = new Notification(title || "Gold Pro · Pattern", opts);
      ok = true;
      try {
        n.onclick = function() {
          try { window.focus(); n.close(); } catch (eC) {}
        };
      } catch (eO) {}
    } catch (e2) {}
    /* 3) Keep push subscription warm for closed-app delivery */
    if (isPat) {
      try { ensurePushSubscription(); } catch (eP) {}
      try { gpRegisterFcm(); } catch (eF) {}
    }
  } catch (e) {}
  return ok;
}

function urlBase64ToUint8Array(base64String) {
  var padding = "=".repeat((4 - (base64String.length % 4)) % 4);
  var base64 = (base64String + padding).replace(/-/g, "+").replace(/_/g, "/");
  var rawData = atob(base64);
  var outputArray = new Uint8Array(rawData.length);
  for (var i = 0; i < rawData.length; ++i) outputArray[i] = rawData.charCodeAt(i);
  return outputArray;
}

/* Subscribe to Web Push so server can wake the device when app is closed (like WhatsApp) */
async function ensurePushSubscription() {
  try {
    if (!("serviceWorker" in navigator) || !("PushManager" in window)) return null;
    if (typeof Notification === "undefined") return null;
    if (Notification.permission !== "granted") return null;
    var reg = await navigator.serviceWorker.ready;
    var existing = await reg.pushManager.getSubscription();
    if (existing) {
      try { localStorage.setItem("gp_push_endpoint", existing.endpoint); } catch (e) {}
      return existing;
    }
    var vapid = (typeof gpResolveVapid === "function" ? gpResolveVapid() : "") ||
      (typeof localStorage !== "undefined" && (localStorage.getItem("gp_fcm_vapid") || localStorage.getItem("gp_vapid_key"))) ||
      (typeof window !== "undefined" && window.GP_VAPID_PUBLIC_KEY) ||
      "";
    var opts = { userVisibleOnly: true };
    if (vapid) {
      try { opts.applicationServerKey = urlBase64ToUint8Array(vapid); } catch (e2) {}
    }
    var sub = await reg.pushManager.subscribe(opts);
    try { localStorage.setItem("gp_push_endpoint", sub.endpoint); } catch (e3) {}
    /* Tell backend so it can push when pattern fires while app is closed */
    try {
      var api = (typeof API_BASE !== "undefined" ? API_BASE : "") + "/push/subscribe";
      await fetch(api, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          subscription: sub.toJSON(),
          app: "goldpro",
          user: (typeof localStorage !== "undefined" && localStorage.getItem("gp_profile")) || null
        })
      });
    } catch (e4) {}
    return sub;
  } catch (e) {
    if (GP_DEBUG) console.warn("[Gold Pro] push subscribe failed", e && e.message);
    return null;
  }
}

async function ensureNotificationPermission() {
  try {
    if (typeof Notification === "undefined") return false;
    if (Notification.permission === "granted") {
      try { await ensurePushSubscription(); } catch (e) {}
      try { await gpRegisterFcm(); } catch (eF) {}
      return true;
    }
    if (Notification.permission === "denied") return false;
    var r = await Notification.requestPermission();
    if (r === "granted") {
      try { await ensurePushSubscription(); } catch (e2) {}
      try { await gpRegisterFcm(); } catch (eF2) {}
      return true;
    }
  } catch (e) {}
  return false;
}

            {/* Search directly under MAILBOX / INBOX title — white frame + Search button */}

            </div>
            <div style={{ display: "flex", gap: 6, marginBottom: 12 }}>

                onChange={function(e) { setReportSearch(e.target.value); }}

                  if (e.key === "Enter") {
                    var s = normalizeSymbol(reportSearch);

                    showToast("Generating " + s + "...");

                placeholder="e.g. XAU, WTI, EURJPY..."
                style={{ flex: 1, minWidth: 0, background: T.card, border: "1px solid " + T.line, borderRadius: 10, padding: "14px 14px", color: T.fg, outline: "none", fontSize: 14, fontWeight: 700 }}
              />
              <button
                onClick={function() {
                  var s = normalizeSymbol(reportSearch);
                  if (!s) { showToast("Type a material first"); return; }
                  setReportSearch(s);
                  showToast("Generating " + s + "...");
                  pushNewReport(s);
                }}
                disabled={reportGenerating}
                className="active-scale"
                style={{ flexShrink: 0, minWidth: 110, background: T.btnOn, color: T.btnOnText, border: "1px solid " + T.btnBorder, padding: "12px 16px", borderRadius: 10, fontWeight: 900, fontSize: 13, minHeight: 48, opacity: reportGenerating ? 0.5 : 1 }}
              >{reportGenerating ? "..." : "Generate"}</button>
            </div>

            {inbox.length === 0 ? (
              <div style={{ padding: "28px 12px", textAlign: "center", color: T.muted, fontSize: 13 }}>
                No reports yet<br />

              </div>
            ) : filteredInbox.length === 0 ? (
              <div style={{ padding: "24px 12px", textAlign: "center", color: T.muted, fontSize: 13 }}>
                No reports for "{reportSearch}"
              </div>
            ) : (
              <div>
                {function() {
                  var wheelItems = (filteredInbox || []).slice(0, 4);
                  var total = wheelItems.length;
                  var maxOff = Math.max(0, total - 1);
                  var off = Math.min(Math.max(0, Number(inboxOffset) || 0), maxOff);
                  function step(dir) {
                    var next = off + dir;
                    if (next < 0) next = 0;
                    if (next > maxOff) next = maxOff;
                    if (next === off) return;
                    setInboxOffset(next);
                    try { playInboxTick(); } catch (err) {}
                  }
                  function rowLabel(item) {
                    if (!item) return "";
                    var stars = "";
                    if (item.type === "prime_pattern" && item.stars >= 5) stars = " ★★★★★";
                    else if (item.type === "prime_pattern" && item.stars >= 1) stars = " ★";
                    return (item.material || "") + stars;
                  }
                  function rowSub(item) {
                    if (!item) return "";
                    return (item.structure || item.trend || "") + (item.price ? (" · " + item.price) : "");
                  }
                  /* Finger swipe on wheel (not arrows only) */
                  var touchY0 = null;
                  var touchT0 = 0;
                  function onTouchStart(e) {
                    try {
                      var t = e.touches && e.touches[0];
                      if (!t) return;
                      touchY0 = t.clientY;
                      touchT0 = Date.now();
                    } catch (x) {}
                  }
                  function onTouchEnd(e) {
                    try {
                      if (touchY0 == null) return;
                      var t = (e.changedTouches && e.changedTouches[0]) || null;
                      if (!t) { touchY0 = null; return; }
                      var dy = t.clientY - touchY0;
                      var dt = Date.now() - touchT0;
                      touchY0 = null;
                      if (Math.abs(dy) < 28) return; /* tap, not swipe */
                      if (dt > 800) return;
                      /* swipe up → next item, swipe down → previous */
                      if (dy < 0) step(1);
                      else step(-1);
                    } catch (x) { touchY0 = null; }
                  }
                  function onWheel(e) {
                    try {
                      if (e && e.preventDefault) e.preventDefault();
                      var d = (e && e.deltaY) || 0;
                      if (d > 8) step(1);
                      else if (d < -8) step(-1);
                    } catch (x) {}
                  }
                  return (
                    <div
                      style={{ border: "1px solid " + T.line, borderRadius: 14, overflow: "hidden", background: T.card, position: "relative", touchAction: "pan-y" }}
                      onTouchStart={onTouchStart}
                      onTouchEnd={onTouchEnd}
                      onWheel={onWheel}
                    >
                      <button
                        type="button"
                        onClick={function(e) { try { e.preventDefault(); e.stopPropagation(); } catch (x) {} step(-1); }}
                        disabled={total <= 1 || off <= 0}
                        className="active-scale"
                        style={{ width: "100%", background: T.soft, border: "none", borderBottom: "1px solid " + T.line, color: (total <= 1 || off <= 0) ? "#3a3a3c" : "#d1d1d6", padding: "10px 0", fontWeight: 900, fontSize: 14, cursor: (total <= 1 || off <= 0) ? "default" : "pointer", WebkitTapHighlightColor: "transparent" }}
                      >▲</button>
                      <div
                        style={{ position: "relative", height: 144, overflow: "hidden", touchAction: "none", WebkitUserSelect: "none", userSelect: "none" }}
                        onTouchStart={onTouchStart}
                        onTouchEnd={onTouchEnd}
                      >
                        <div style={{ position: "absolute", left: 0, right: 0, top: "50%", marginTop: -24, height: 48, background: appTheme === "dark" ? "#3a3a3c" : "#d1d1d6", zIndex: 0, pointerEvents: "none" }} />
                        <div style={{ position: "relative", zIndex: 1, display: "flex", flexDirection: "column", justifyContent: "center", height: "100%" }}>
                          {[-1, 0, 1].map(function(delta) {
                            var i = off + delta;
                            if (i < 0 || i >= total) {
                              return <div key={"e" + delta} style={{ height: 48 }} />;
                            }
                            var item = wheelItems[i];
                            var selected = delta === 0;
                            return (
                              <div
                                key={(item.id || i) + "-" + delta}
                                style={{
                                  height: 48,
                                  display: "flex",
                                  alignItems: "center",
                                  padding: "0 10px",
                                  gap: 8,
                                  opacity: selected ? 1 : 0.32,
                                  filter: selected ? "none" : "blur(0.5px)",
                                  color: selected ? (appTheme === "dark" ? "#f2f2f7" : "#1c1c1e") : T.muted,
                                  boxSizing: "border-box"
                                }}
                              >
                                <button
                                  type="button"
                                  onClick={function(e) {
                                    try { e.preventDefault(); e.stopPropagation(); } catch (x) {}
                                    if (selected) {
                                      setOpenReportId(item.id);
                                    } else {
                                      setInboxOffset(i);
                                      try { playInboxTick(); } catch (er) {}
                                    }
                                  }}
                                  style={{
                                    flex: 1, minWidth: 0, display: "flex", alignItems: "center", gap: 8,
                                    background: "transparent", border: "none", padding: 0, margin: 0,
                                    color: "inherit", textAlign: "left", cursor: "pointer"
                                  }}
                                >
                                  <div style={{
                                    width: 30, height: 30, borderRadius: 7, flexShrink: 0,
                                    background: selected ? "#48484a" : "#2c2c2e",
                                    border: "1px solid " + (selected ? "#636366" : "#3a3a3c"),
                                    display: "flex", alignItems: "center", justifyContent: "center",
                                    fontWeight: 900, fontSize: 9,
                                    color: selected ? (appTheme === "dark" ? "#f2f2f7" : "#1c1c1e") : T.muted
                                  }}>{String(item.material || "").slice(0, 3)}</div>
                                  <div style={{ flex: 1, minWidth: 0 }}>
                                    <div style={{ display: "flex", justifyContent: "space-between", gap: 8, alignItems: "baseline" }}>
                                      <div style={{ fontWeight: 800, fontSize: 13, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>
                                        {rowLabel(item)}
                                      </div>
                                      <div style={{ fontSize: 12, fontWeight: 600, flexShrink: 0, opacity: selected ? 0.85 : 0.6 }}>{item.timeLabel || ""}</div>
                                    </div>
                                    <div style={{ fontSize: 11, marginTop: 2, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap", opacity: selected ? 0.75 : 0.5 }}>
                                      {rowSub(item)}
                                    </div>
                                  </div>
                                </button>
                                {selected ? (
                                  <button
                                    type="button"
                                    onClick={function(e) {
                                      try { e.preventDefault(); e.stopPropagation(); } catch (x) {}
                                      var name = item.material || "report";
                                      if (window.confirm("Delete " + name + "?")) {
                                        deleteReport(item.id);
                                      }
                                    }}
                                    style={{
                                      flexShrink: 0, width: 40, height: 40, borderRadius: 10,
                                      background: T.btnOn, border: "1px solid " + T.btnBorder,
                                      color: "#d1d1d6", fontSize: 16, cursor: "pointer",
                                      WebkitTapHighlightColor: "transparent"
                                    }}
                                  >🗑</button>
                                ) : null}
                              </div>
                            );
                          })}
                        </div>
                      </div>
                      <button
                        type="button"
                        onClick={function(e) { try { e.preventDefault(); e.stopPropagation(); } catch (x) {} step(1); }}
                        disabled={total <= 1 || off >= maxOff}
                        className="active-scale"
                        style={{ width: "100%", background: T.soft, border: "none", borderTop: "1px solid " + T.line, color: (total <= 1 || off >= maxOff) ? "#3a3a3c" : "#d1d1d6", padding: "10px 0", fontWeight: 900, fontSize: 14, cursor: (total <= 1 || off >= maxOff) ? "default" : "pointer", WebkitTapHighlightColor: "transparent" }}
                      >▼</button>
                      <div style={{ fontSize: 10, color: "#636366", textAlign: "center", padding: "6px 0 8px" }}>
                        {total === 0 ? "No reports" : ((off + 1) + " / " + total + " · swipe or ▲▼")}
                      </div>
                    </div>
                  );
                }()}
              </div>
            )}

            {inbox.length > 0 ? (
              <div style={{ display: "flex", gap: 8, marginTop: 10 }}>
                <button
                  onClick={function() { setMailboxOpen(true); }}
                  className="active-scale"
                  style={{ flex: 1, background: T.btn, color: T.btnText, border: "1px solid " + T.btnBorder, padding: 11, borderRadius: 10, fontWeight: 800, fontSize: 12 }}
                >Full screen</button>
                <button

                    if (window.confirm("Delete ALL " + inbox.length + " reports?")) {

                  className="active-scale"
                  style={{ background: "transparent", color: "#d93025", border: "1px solid #5f2120", padding: "11px 12px", borderRadius: 10, fontWeight: 800, fontSize: 12 }}

          </div>

          {/* ===== FULL MAILBOX OVERLAY ===== */}
          {mailboxOpen ? (

              <div style={{ padding: "12px 12px", borderBottom: "1px solid " + T.line, display: "flex", alignItems: "center", gap: 10, paddingTop: "max(12px, env(safe-area-inset-top))" }}>
                <button
                  onClick={function() { setMailboxOpen(false); }}

                  style={{ background: T.soft, color: T.fg, border: "1px solid " + T.line, width: 44, height: 44, borderRadius: 12, fontWeight: 900, fontSize: 20, flexShrink: 0, display: "flex", alignItems: "center", justifyContent: "center" }}

                <div style={{ flex: 1, minWidth: 0 }}>
                  <div style={{ fontWeight: 900, fontSize: 16 }}>Full Inbox</div>
                  <div style={{ fontSize: 10, color: T.muted }}>{filteredInbox.length} / {inbox.length}</div>
                </div>
                <button onClick={function() { setMailboxOpen(false); }} className="active-scale" style={{ background: T.btnOn, color: T.btnOnText, border: "none", padding: "10px 14px", borderRadius: 8, fontWeight: 900, fontSize: 12, flexShrink: 0 }}>Back</button>
              </div>

              <div style={{ padding: "10px 12px", borderBottom: "1px solid " + T.line }}>
                <div style={{ fontSize: 10, color: T.muted, fontWeight: 800, marginBottom: 6 }}>FILTER REPORTS</div>
                <div style={{ display: "flex", gap: 6 }}>
                  <input
                    value={reportSearch}
                    onChange={function(e) { setReportSearch(e.target.value); }}

                  />

                    <button onClick={function() { setReportSearch(""); }} className="active-scale" style={{ background: "transparent", color: T.muted, border: "1px solid " + T.line, padding: "0 12px", borderRadius: 8, fontWeight: 800 }}>Clear</button>

                </div>
                <div style={{ fontSize: 10, color: T.muted, marginTop: 6 }}>Filter only</div>

              <div style={{ flex: 1, overflowY: "auto", WebkitOverflowScrolling: "touch" }}>
                {filteredInbox.length === 0 ? (
                  <div style={{ padding: 40, textAlign: "center", color: T.muted }}>
                    {inbox.length === 0 ? "Mailbox empty" : ("No match for \"" + reportSearch + "\"")}

                  filteredInbox.map(function(item, idx) {
                    return (
                      <div key={item.id} style={{ display: "flex", borderBottom: "1px solid " + T.line, background: idx % 2 === 0 ? T.card : T.soft }}>

                          onClick={function() { setOpenReportId(item.id); setMailboxOpen(false); }}

                              <div style={{ fontWeight: 800, fontSize: 13 }}>

                                {item.timeframe ? <span style={{ fontSize: 10, color: T.muted, marginLeft: 6 }}>{item.timeframe}</span> : null}
                              </div>
                              <div style={{ fontSize: 10, color: T.muted }}>{item.timeLabel}</div>
                            </div>
                            <div style={{ fontSize: 11, color: T.muted, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{item.structure || item.trend} · {item.price}{item.support && item.support !== "--" ? (" · S " + item.support + " / R " + item.resistance) : ""}</div>
                            <div style={{ fontSize: 10, color: T.muted, marginTop: 2 }}>{item.dateLabel} · #{item.report_count}</div>
                          </div>
                        </button>
                        <button
                          onClick={function(e) {
                            e.stopPropagation();
                            if (window.confirm("Delete " + item.material + " report?")) deleteReport(item.id);
                          }}
                          style={{ width: 52, border: "none", borderLeft: "1px solid " + T.line, background: "transparent", color: "#777", fontSize: 16 }}
                        >🗑</button>
                      </div>
                    );
                  })

              </div>

              <div style={{ padding: "12px 12px", borderTop: "1px solid " + T.line, paddingBottom: "max(12px, env(safe-area-inset-bottom))", display: "flex", flexDirection: "column", gap: 8 }}>
                <button
                  onClick={function() { setMailboxOpen(false); }}
                  className="active-scale"
                  style={{ width: "100%", background: T.btnOn, color: T.btnOnText, border: "none", padding: 14, borderRadius: 12, fontWeight: 900, fontSize: 14 }}
                >← Back</button>
                {inbox.length > 0 ? (
                  <button
                    onClick={function() {
                      if (window.confirm("Delete ALL " + inbox.length + " reports from this device?")) {
                        persistInbox([]);
                        showToast("Inbox cleared");
                      }
                    }}
                    className="active-scale"
                    style={{ width: "100%", background: "transparent", color: "#d93025", border: "1px solid #5f2120", padding: 12, borderRadius: 10, fontWeight: 800, fontSize: 12 }}
                  >Clear all</button>
                ) : null}
              </div>
            </div>
          ) : null}
        </div>

        {/* PROFILE */}
        <div style={{ display: tab === "profile" ? "block" : "none", paddingBottom: 72, background: T.bg }}>
          <div style={{ padding: 16, maxWidth: 480, margin: "0 auto" }}>
            <div style={{ marginBottom: 16, display: "flex", justifyContent: "flex-end" }}>
              <button
                type="button"
                onClick={function(ev) {
                  try { if (ev && ev.preventDefault) ev.preventDefault(); } catch (e0) {}
                  var next = !notifEnabled;
                  /* Toggle UI immediately so button always responds */
                  setNotifEnabled(next);
                  try { localStorage.setItem("gp_notif", next ? "1" : "0"); } catch (e) {}
                  if (!next) {
                    showToast("Notifications OFF");
                    return;
                  }
                  /* User gesture: ring once so the bell is audible when enabling */
                  try { gpPlayBell(); } catch (eBell) {}
                  showToast("Notifications ON · bell test");
                  ensureNotificationPermission().then(function(ok) {
                    if (ok) {
                      showToast("Notifications ON · pattern only");
                      try {
                        gpRegisterFcm().then(function(tok) {
                          if (tok) showToast("FCM ready · patterns only");
                          else showToast("Local notify OK · push setup pending");
                        });
                      } catch (eF) {}
                    } else {
                      showToast("Bell ON · allow notifications in phone Settings for system push");
                    }
                  }).catch(function() {
                    showToast("Bell ON · check phone notification settings");
                  });
                }}
                className="active-scale"
                title={notifEnabled ? "Notifications ON" : "Notifications OFF"}
                style={{
                  width: 52, height: 52, borderRadius: 26, flexShrink: 0,
                  background: notifEnabled ? T.btnOn : T.btn,
                  color: notifEnabled ? T.btnOnText : T.btnText,
                  border: "1px solid " + T.btnBorder,
                  fontSize: 22, fontWeight: 900, display: "flex", alignItems: "center", justifyContent: "center",
                  boxShadow: notifEnabled ? "0 0 12px rgba(255,255,255,0.25)" : "none",
                  cursor: "pointer",
                  WebkitTapHighlightColor: "transparent",
                  touchAction: "manipulation"
                }}
              >{notifEnabled ? "🔔" : "🔕"}</button>
            </div>

            <div
              onClick={undefined}
              onTouchEnd={undefined}
              role="button"
              style={{ fontWeight: 900, fontSize: 22, marginBottom: 4, color: T.fg, letterSpacing: 0.3, cursor: "pointer", userSelect: "none", WebkitUserSelect: "none", touchAction: "manipulation", padding: "8px 0" }}
            >Profile</div>
            <div
              onClick={undefined}
              onTouchEnd={undefined}
              style={{ fontSize: 12, color: T.muted, marginBottom: 16, padding: "6px 0", touchAction: "manipulation", userSelect: "none" }}
            >Account · Delivery · Subscription</div>

            <div style={{ background: T.card, border: "1px solid " + T.line, borderRadius: 14, padding: 16, marginBottom: 14 }}>
              <div style={{ fontWeight: 900, marginBottom: 4, fontSize: 13, letterSpacing: 0.4 }}>PERSONAL</div>
              <div style={{ fontSize: 10, color: T.muted, marginBottom: 12 }}>Saved on this device only</div>
              <div style={{ fontSize: 10, color: T.muted, fontWeight: 700, marginBottom: 6 }}>FULL NAME</div>
              <input value={profile.name} onChange={function(e) { setProfile(Object.assign({}, profile, { name: e.target.value })); }} placeholder="Your name" type="text" style={{ width: "100%", boxSizing: "border-box", background: T.card, border: "1px solid " + T.line, borderRadius: 10, padding: "14px 14px", color: T.fg, marginBottom: 12, fontSize: 15, outline: "none", fontWeight: 600, WebkitTextFillColor: T.fg }} />
