function detectCurrency() {
  try {
    const lang = (navigator.language || "en-US").toLowerCase();
    const tz = Intl.DateTimeFormat().resolvedOptions().timeZone || "";
    if (lang.startsWith("en-gb") || tz.includes("London") || tz === "Europe/London")
      return { symbol: "£", code: "GBP", monthly: 15, yearly: 150 };
    const euLangs = ["de","fr","it","es","nl","pt","pl","ro","cs","hu","sk","fi","sv","da","el","bg","hr","lt","lv","et","sl","mt","ga"];
    const euTz = ["Europe/Berlin","Europe/Paris","Europe/Rome","Europe/Madrid","Europe/Amsterdam","Europe/Brussels","Europe/Vienna","Europe/Warsaw","Europe/Lisbon","Europe/Athens","Europe/Dublin","Europe/Zurich","Europe/Stockholm","Europe/Helsinki","Europe/Prague","Europe/Budapest"];
    if (euLangs.some(l => lang.startsWith(l)) || euTz.some(t => tz === t || tz.includes(t.replace("Europe/",""))) || lang.startsWith("en-ie") || lang.startsWith("en-mt"))
      return { symbol: "€", code: "EUR", monthly: 17, yearly: 170 };
  } catch {}
  return { symbol: "$", code: "USD", monthly: 19, yearly: 190 };
}

function utcMinutes() {
  const d = new Date();
  return d.getUTCHours() * 60 + d.getUTCMinutes();
}

function sessionStatus(s, now) {
  const openM = s.open * 60, closeM = s.close * 60;
  if (closeM < openM) {
    if (now >= openM || now < closeM) return "open";
    let left = openM - now; if (left < 0) left += 1440;
    return left <= 30 ? "soon" : "closed";
  }
  if (now >= openM && now < closeM) return "open";
  let left = openM - now; if (left < 0) left += 1440;
  return left <= 30 ? "soon" : "closed";
}

function minsToClose(s, now) {
  const closeM = s.close * 60, openM = s.open * 60;
  if (closeM < openM) {
    if (now >= openM) return 1440 - now + closeM;
    return closeM - now;
  }
  return closeM - now;
}

function minsToOpen(openH, now) {
  let r = openH * 60 - now;
  if (r < 0) r += 1440;
  return r;
}

function fmtMins(m) {
  const h = Math.floor(m / 60), mm = m % 60;

}

  const blob = new Blob([text], { type: mime || "text/plain" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();

  URL.revokeObjectURL(url);
}

async function fetchCandles(symbol, tf) {
  var ref = REF_PRICE[symbol] || 100;

  // FX majors: Frankfurter (ECB) first — CORS-friendly and accurate
  var fxMap = { GBPUSD: ["GBP", "USD"], EURUSD: ["EUR", "USD"], USDJPY: ["USD", "JPY"] };
  var fx = fxMap[symbol];
  if (fx) {
    try {
      var fUrl = "https://api.frankfurter.app/latest?from=" + fx[0] + "&to=" + fx[1];
      var fRes = await fetch(fUrl);
      if (fRes.ok) {
        var fData = await fRes.json();
        var spot = fData.rates[fx[1]];
        if (spot && isFinite(spot) && spot > 0) {
          var outF = [];
          for (var j = 0; j < 80; j++) {
            var n = (Math.random() - 0.5) * spot * 0.0006;
            var p = spot + n;
            outF.push({ open: p, close: p, high: p + Math.abs(n), low: p - Math.abs(n) });
          }
          return outF;
        }
      }
    } catch (e0) {}
  }

  // Yahoo for commodities / stocks / crypto
  var ySym = YAHOO_SYMBOL[symbol];
  if (ySym) {
    try {
      var yUrl = "https://query1.finance.yahoo.com/v8/finance/chart/" + encodeURIComponent(ySym) + "?interval=30m&range=5d";
      var yRes = await fetch(yUrl);
      if (yRes.ok) {
        var yData = await yRes.json();
        var result = yData.chart.result[0];
        var q = result.indicators.quote[0];
        var rows = [];
        for (var i = 0; i < q.close.length; i++) {
          if (q.close[i] == null || q.open[i] == null) continue;
          rows.push({ open: q.open[i], high: q.high[i], low: q.low[i], close: q.close[i] });
        }
        if (rows.length > 10) {
          var lastC = rows[rows.length - 1].close;
          if (lastC > ref * 0.5 && lastC < ref * 1.6) return rows;
        }
      }
    } catch (e1) {}
  }

  // Binance crypto
  var bnSym = BINANCE_MAP[symbol];
  if (bnSym) {
    try {
      var bnUrl = "https://api.binance.com/api/v3/klines?symbol=" + bnSym + "&interval=30m&limit=120";
      var bnRes = await fetch(bnUrl);
      if (bnRes.ok) {
        var bnData = await bnRes.json();
        if (bnData.length > 20) {
          return bnData.map(function(k) {
            return { open: parseFloat(k[1]), high: parseFloat(k[2]), low: parseFloat(k[3]), close: parseFloat(k[4]) };
          });
        }
      }
    } catch (e2) {}
  }

  // Safe synthetic around reference
  var price = ref;
  var out = [];
  var vol = ref >= 50 ? ref * 0.001 : ref * 0.0008;
  for (var k = 0; k < 80; k++) {
    var noise = (Math.random() - 0.5) * vol;
    price = price + noise;
    if (price < ref * 0.99) price = ref * 0.99;
    if (price > ref * 1.01) price = ref * 1.01;
    out.push({ open: price, close: price, high: price + Math.abs(noise), low: price - Math.abs(noise) });
  }
  return out;
}

function sma(candles, period) {
  var out = [];
  for (var i = 0; i < candles.length; i++) {
    if (i < period - 1) { out.push(null); continue; }
    var sum = 0;
    for (var j = i - period + 1; j <= i; j++) sum += candles[j].close;
    out.push(sum / period);
  }
  return out;
}

function newsAssetKey(symbol) {
  var s = (symbol || "").toUpperCase();
  if (s.indexOf("XAU") >= 0 || s === "GOLD") return "XAUUSD";
  if (s.indexOf("XAG") >= 0 || s === "SILVER") return "XAUUSD";
  if (s.indexOf("WTI") >= 0 || s.indexOf("OIL") >= 0 || s.indexOf("BRENT") >= 0) return "WTIUSD";
  if (s.indexOf("BTC") >= 0) return "DEFAULT";
  return NEWS_BY_ASSET[s] ? s : "DEFAULT";
}

function pickNewsLine(source, seed, symbol) {
  var key = newsAssetKey(symbol);
  var pack = NEWS_BY_ASSET[key] || NEWS_BY_ASSET.DEFAULT;
  var bank = pack[source] || pack.Bloomberg || NEWS_BY_ASSET.DEFAULT.Bloomberg;
  return bank[Math.abs(seed) % bank.length];
}

function buildAnalysis(symbol, trend, support, resistance, price) {
  var name = (typeof DISPLAY !== "undefined" && DISPLAY[symbol]) ? DISPLAY[symbol] : symbol;
  var dir = trend.indexOf("Bull") >= 0 ? "bullish" : trend.indexOf("Bear") >= 0 ? "bearish" : "neutral / range-bound";
  return (
    name + " is trading near " + price + " with a " + dir + " bias. " +
    "Support at " + support + " is the floor where buyers previously defended price — a hold keeps the structure intact; a clean break increases downside risk. " +
    "Resistance at " + resistance + " is the ceiling where sellers previously appeared — a break and hold above opens room for continuation. " +
    "Between these two levels the market is in a defined range. Watch how price reacts on the next touch of support or resistance for confirmation."
  );
}

function buildSummary(symbol, trend, support, resistance) {
  var name = (typeof DISPLAY !== "undefined" && DISPLAY[symbol]) ? DISPLAY[symbol] : symbol;
  return (
    name + " report: Trend " + trend + ". " +
    "Primary support " + support + " (demand zone / memory of prior bounces). " +
    "Primary resistance " + resistance + " (supply zone / memory of prior rejects). " +
    "Plan: respect the range until a clear break and hold beyond either level. Informational only — not financial advice."
  );
}

async function generateServerReport(material, profile, reportNumber) {
  var symbol = normalizeSymbol(material);
  var candles = await fetchCandles(symbol, "30");
  var last = candles[candles.length - 1];
  var closes = candles.map(function(c) { return c.close; });
  var recent = closes.slice(-20);
  var avg = recent.reduce(function(a, b) { return a + b; }, 0) / recent.length;
  var priceNum = last ? last.close : avg;
  var high20 = Math.max.apply(null, candles.slice(-20).map(function(c) { return c.high; }));
  var low20 = Math.min.apply(null, candles.slice(-20).map(function(c) { return c.low; }));
  // Clamp to realistic band
  var refP = REF_PRICE[symbol] || 0;
  var isFx = symbol === "GBPUSD" || symbol === "EURUSD" || symbol === "USDJPY" || symbol === "GBPJPY" || symbol === "EURJPY";
  var isGold = symbol === "XAUUSD" || symbol === "GOLD";
  var loMul = isFx ? 0.92 : (isGold ? 0.85 : 0.5);
  var hiMul = isFx ? 1.08 : (isGold ? 1.15 : 1.8);
  if (refP > 0 && (!isFinite(priceNum) || priceNum < refP * loMul || priceNum > refP * hiMul)) {
    priceNum = refP;
    high20 = refP * 1.006;
    low20 = refP * 0.994;
  }
  if (refP > 0) {
    if (!isFinite(high20) || high20 > refP * hiMul) high20 = priceNum * 1.004;
    if (!isFinite(low20) || low20 < refP * loMul) low20 = priceNum * 0.996;
  }
  var decimals = priceNum > 50 ? 2 : 4;
  var support = (low20 * 0.998).toFixed(decimals);
  var resistance = (high20 * 1.002).toFixed(decimals);
  var ma50 = sma(candles, 50);
  var lastMa = ma50[ma50.length - 1];
  var trend = "Neutral ◆";
  if (lastMa != null) {
    if (priceNum > lastMa * 1.002) trend = "Bullish ▲";
    else if (priceNum < lastMa * 0.998) trend = "Bearish ▼";
  } else {
    var slope = recent[recent.length - 1] - recent[0];
    if (slope > 0) trend = "Bullish ▲";
    else if (slope < 0) trend = "Bearish ▼";
  }
  var seed = Date.now() + symbol.charCodeAt(0);
  var news = {};
  NEWS_SOURCES.forEach(function(src, i) {
    news["news" + (i + 1)] = pickNewsLine(src, seed + i * 17, symbol);
  });
  var priceStr = pricePrefix(symbol) + Number(priceNum).toFixed(decimals);
  var analysis = buildAnalysis(symbol, trend, support, resistance, priceStr);
  var summary = buildSummary(symbol, trend, support, resistance);
  var now = Date.now();
  var stamp = formatReportStamp(now);
  return Object.assign({
    id: "rpt_" + now + "_" + symbol,
    createdAt: now,
    expiry: now + THIRTY_DAYS,
    material: symbol,
    displayName: DISPLAY[symbol] || symbol,
    dateLabel: stamp.date,
    timeLabel: stamp.time,
    stampFull: stamp.full,
    username: (profile && profile.name) ? profile.name : "Prime User",
    user_email: (profile && profile.email) ? profile.email : "user@goldpro.com",
    report_count: reportNumber,
    price: priceStr,
    priceNum: priceNum,
    trend: trend,
    support: support,
    resistance: resistance,
    analysis: analysis,
    summary: summary
  }, news);
}

  var middle = bull

    : bear

    : ("Inside the range, neither side won. Liquidity rested, ranges tightened, and traders waited for a clear break. This is the quiet chapter before a louder move.");
  var memory = "When price returns to " + support + " or " + resistance + ", it is not visiting random numbers — it is revisiting levels the market already reacted to before. That memory is why bounces, rejects, and false breaks keep repeating at the same zones.";
  var ending = bull
    ? ("This four-hour story closes with a constructive tone near " + price + ". The next page is simple: hold above support, watch " + resistance + ". Informational only — not financial advice.")
    : bear
    ? ("This four-hour story closes with pressure still present near " + price + ". The next page is simple: defend or lose " + support + ", and respect " + resistance + " on any bounce. Informational only — not financial advice.")
    : ("This four-hour story closes in balance near " + price + ". The next page will be written by a break of " + support + " or " + resistance + ". Informational only — not financial advice.");
  return { title: "The 4-Hour Story of " + name, opening: opening, levels: levels, middle: middle, memory: memory, ending: ending };
}

              <div onClick={function() { setBilling("yearly"); }} style={{ borderRadius: 12, padding: 12, marginBottom: 8, cursor: "pointer", border: billing === "yearly" ? "2px solid #fff" : "1px solid #2a2a2a", background: billing === "yearly" ? "#111" : "#000" }}>
                <div style={{ display: "flex", justifyContent: "space-between" }}>
                  <div>
                    <div style={{ fontWeight: 800 }}>Pro Yearly - Save {currency.symbol}{savings}</div>
                    <div style={{ fontSize: 10, color: "#888", marginTop: 2 }}>All Pro + Priority Support</div>
                  </div>
                  <div style={{ textAlign: "right" }}>
                    <div style={{ fontWeight: 900, fontSize: 18 }}>{currency.symbol}{currency.yearly}</div>
                    <div style={{ fontSize: 10, color: "#888" }}>/year</div>
                  </div>
                </div>
              </div>
              <button onClick={function() { showToast("Subscribe " + currency.symbol + currency.monthly + " Monthly"); }} className="active-scale" style={{ width: "100%", background: "transparent", color: "#fff", border: "1px solid #fff", padding: 14, borderRadius: 8, fontWeight: 900, marginTop: 10 }}>Subscribe {currency.symbol}{currency.monthly} Monthly - Popular</button>
              <button onClick={function() { showToast("Subscribe " + currency.symbol + currency.yearly + " Yearly"); }} className="active-scale" style={{ width: "100%", background: "#fff", color: "#000", border: "1px solid #fff", padding: 14, borderRadius: 8, fontWeight: 900, marginTop: 8 }}>Subscribe {currency.symbol}{currency.yearly} Yearly - Best Value</button>
            </div>

            <div style={{ background: "#000", border: "1px solid #2a2a2a", borderRadius: 12, padding: 14 }}>
              <div style={{ fontWeight: 800, marginBottom: 12 }}>Legal & Support</div>
              {[{ key: "privacy", icon: "🔒", title: "Privacy Policy", sub: "UK GDPR - Data protection" }, { key: "terms", icon: "📄", title: "Terms of Use", sub: "Terms & Conditions - Analyzer only" }, { key: "about", icon: "G", title: "About Gold Pro", sub: "Dark Terminal • Material Reports", white: true }].map(function(item, idx) {
                return (
                  <div key={item.key} onClick={function() { setModal(item.key); }} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "16px 0", borderBottom: idx < 2 ? "1px solid #222" : "none", cursor: "pointer" }}>
                    <div style={{ display: "flex", gap: 10, alignItems: "center" }}>
                      <div style={{ background: item.white ? "#fff" : "#1a1d23", color: item.white ? "#000" : "#fff", width: 36, height: 36, borderRadius: 8, display: "flex", alignItems: "center", justifyContent: "center", fontWeight: 900 }}>{item.icon}</div>
                      <div>
                        <div style={{ fontWeight: 700 }}>{item.title}</div>
                        <div style={{ fontSize: 10, color: "#888" }}>{item.sub}</div>
                      </div>
                    </div>
                    <span style={{ fontSize: 20 }}>›</span>
                  </div>
                );
              })}
            </div>

            <div style={{ textAlign: "center", marginTop: 16, padding: 10 }}>
              <div style={{ fontSize: 10, color: "#555" }}>© 2025 Gold Pro • Dark Terminal • {currency.symbol}{currency.monthly}/{currency.symbol}{currency.yearly}</div>
            </div>
          </div>
        </div>

        {/* Bottom nav */}
        <div style={{ position: "fixed", bottom: 0, left: 0, right: 0, background: "#000", borderTop: "2px solid #fff", display: "flex", justifyContent: "space-around", padding: "8px 0 28px", zIndex: 99999, width: "100%" }}>
          <div style={{ display: "flex", justifyContent: "space-around", width: "100%", maxWidth: 560, margin: "0 auto" }}>
            {[{ id: "home", icon: "⌂", label: "Home" }, { id: "reports", icon: "📬", label: "Inbox" }, { id: "profile", icon: "👤", label: "Profile" }].map(function(item) {
              return (
                <button key={item.id} onClick={function() { setTab(item.id); }} className="active-scale" style={{ position: "relative", background: tab === item.id ? "rgba(255,255,255,0.05)" : "transparent", border: tab === item.id ? "1px solid #fff" : "1px solid transparent", color: tab === item.id ? "#fff" : "#888", fontWeight: 800, fontSize: 11, cursor: "pointer", display: "flex", flexDirection: "column", alignItems: "center", gap: 4, minWidth: 80, flex: 1, margin: "0 4px", minHeight: 70, padding: 12, borderRadius: 12 }}>
                  <span style={{ fontSize: 22 }}>{item.icon}</span>
                  {item.label}
                  {item.id === "reports" && inbox.length > 0 && (
                    <span style={{ position: "absolute", top: 8, right: "28%", background: "#b91c1c", color: "#fff", fontSize: 9, fontWeight: 900, minWidth: 16, height: 16, borderRadius: 8, display: "flex", alignItems: "center", justifyContent: "center", padding: "0 4px" }}>{inbox.length > 99 ? "99+" : inbox.length}</span>
                  )}
                </button>
              );
            })}
          </div>
        </div>

        {modal && (
          <div onClick={function(e) { if (e.target === e.currentTarget) setModal(null); }} style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.9)", backdropFilter: "blur(2px)", zIndex: 100001, display: "flex", alignItems: "center", justifyContent: "center", padding: 20 }}>
            <div style={{ background: "#000", border: "2px solid #fff", borderRadius: 14, padding: 20, width: "100%", maxWidth: 420, maxHeight: "85vh", overflowY: "auto" }}>
              <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 14 }}>
                <div style={{ fontWeight: 800 }}>{modal === "privacy" ? "Privacy Policy - UK GDPR" : modal === "terms" ? "Terms of Use" : "About Gold Pro"}</div>
                <button onClick={function() { setModal(null); }} className="active-scale" style={{ background: "transparent", border: "1px solid #444", color: "#fff", padding: "8px 14px", borderRadius: 8, fontWeight: 700 }}>X</button>
              </div>
              {modal === "privacy" && (
                <div style={{ fontSize: 12, color: "#ddd", lineHeight: 1.6 }}>
                  Dark Terminal - Privacy Policy<br /><br />
                  <b>Data Collected:</b> Full Name, Mobile Number, Email Address.<br />
                  <b>Usage:</b> Account management, subscription {currency.symbol}{currency.monthly}/{currency.symbol}{currency.yearly}.<br />
                  <b>Storage:</b> Reports stored locally on device only.<br />
                  <b>No Sharing:</b> Never sell data.<br />
                  <b>Rights:</b> Access, delete, export.<br /><br />
                  Contact: privacy@goldpro.uk
                </div>
              )}
              {modal === "terms" && (
                <div style={{ fontSize: 12, color: "#ddd", lineHeight: 1.6 }}>
                  Dark Terminal - Terms of Use<br /><br />
                  <b>1. Analyzer Only:</b> Not financial advice.<br />
                  <b>2. Subscription:</b> {currency.symbol}{currency.monthly} Monthly / {currency.symbol}{currency.yearly} Yearly.<br />
                  <b>3. Material Reports:</b> Generated on a 30-minute cadence and delivered to your local inbox. Display only.<br />
                  <b>4. Risk:</b> Trading involves risk.<br />
                </div>
              )}
              {modal === "about" && (
                <div style={{ fontSize: 12, color: "#ddd", textAlign: "center", lineHeight: 1.8 }}>
                  Gold Pro - Dark Terminal<br />White & Black Edition<br /><br />
                  • Material Reports every 30 minutes<br />
                  • Email-style Inbox with open / delete<br />
                  • Local storage • 30-day auto cleanup<br />
                  • TradingView live charts • MA50<br />
                  • English only interface<br />
                  © 2025 • Gold Pro
                </div>
              )}
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(
  React.createElement(React.StrictMode, null, React.createElement(App, null))
);
  </script>
</body>
