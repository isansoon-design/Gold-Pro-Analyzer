.ok{color:#0f0}.bad{color:#f55}

<body>
<h2>🔔 اختبار FCM - Gold Pro</h2>
<button onclick="doTest()">1️⃣ فعل الاشعارات و جيب التوكن</button>
<button onclick="testLocal()">2️⃣ جرب اشعار محلي</button>
<button onclick="copyToken()">📋 انسخ التوكن</button>
<div id="log" class="log">جاهز... اضغط الزر الاول
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyCDk-mTPha6BwSxscy6blssD7DaMyJAoSY",
  authDomain: "xauusd-c41d0.firebaseapp.com",
  projectId: "xauusd-c41d0",
  storageBucket: "xauusd-c41d0.firebasestorage.app",
  messagingSenderId: "390056297494",
  appId: "1:390056297494:web:8e1494afa2c4be4cf86137",
  measurementId: "G-5LNE1P01E1"
};
firebase.initializeApp(firebaseConfig);
let token = null;
const VAPID = "BL0x3t_OqBEbSyn0XNMGmksO4GXCYJNoC6rVcG9TEWzSsnNRGJqLTdtDsd4CcqhhzS7jWfwzjjnN45Tzko7zgkg";
const logEl = document.getElementById('log');
function log(t, cls=''){
  logEl.innerHTML += (cls?`<span class="${cls}">`:'') + t + (cls?'</span>':'') + "\n";
  logEl.scrollTop = logEl.scrollHeight;
}

async function doTest(){
  logEl.innerHTML='';
  log('يبدأ الفحص...');
  log('Permission: '+Notification.permission);
  log('SW support: '+('serviceWorker' in navigator));
  log('Messaging support: '+(firebase.messaging.isSupported() ? 'YES' : 'NO'));
  if(!('serviceWorker' in navigator)){ log('❌ المتصفح لا يدعم Service Worker', 'bad'); return; }
  try{
    const perm = await Notification.requestPermission();
    log('Permission after request: '+perm, perm==='granted'?'ok':'bad');
    if(perm!=='granted'){ log('❌ لازم تكبس Allow', 'bad'); return; }
    log('يسجل Service Worker...');
    let reg = null;
    try{
      reg = await navigator.serviceWorker.register('./firebase-messaging-sw.js', {scope:'./'});
      log('✅ SW registered: '+reg.scope, 'ok');
    }catch(e){
      log('❌ SW failed: '+e.message, 'bad');
      return;
    }
    await navigator.serviceWorker.ready;
    const messaging = firebase.messaging();
    log('يجيب التوكن... (ياخد 3 ثواني)');
    try{
      token = await messaging.getToken({vapidKey: VAPID, serviceWorkerRegistration: reg});
      log('✅ TOKEN SUCCESS:', 'ok');
      log(token);
      localStorage.setItem('gp_fcm_token', token);
      log('\n📋 انسخ التوكن وابعته للسيرفر اذا بدك Push عن بعد', 'ok');
    }catch(e){
      log('❌ Token failed: '+e.message, 'bad');
      log(JSON.stringify(e));
    }
  }catch(e){ log('Error: '+e.message, 'bad'); }
}

function testLocal(){
  if(Notification.permission!=='granted'){ log('❌ Permission not granted', 'bad'); return; }
  try{
    new Notification('Gold Pro Test ✅', {body:'اذا شفت هاد، الاشعارات المحلية شغالة!', icon:'./icon-192.png'});
    log('✅ Local notification sent', 'ok');
  }catch(e){ log('❌ '+e.message, 'bad'); }
}

function copyToken(){
  if(!token){ log('❌ ما في توكن، كبس الزر الاول', 'bad'); return; }
  navigator.clipboard.writeText(token).then(()=>log('✅ Token copied!', 'ok'));
}
</script>

ment(){var body=document.body;if(!body)return;try{window.focus();}catch(e){}if(!body.hasAttribute("tabindex"))body.setAttribute("tabindex","-1");try{body.focus({preventScroll:true});}catch(e){try{body.focus();}catch(e2){}}}window.addEventListener("message",function(event){if(event.source!==window.parent)return;var data=event.data;if(!data||typeof data!=="object"||data.type!==FOCUS_TYPE)return;if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",focusArtifactDocument,{once:true});return;}focusArtifactDocument();});window.addEventListener("keydown",function(event){if(event.key!=="Escape")return;window.setTimeout(function(){if(event.defaultPrevented)return;window.parent.postMessage({type:CLOSE_TYPE},"*");},0);});})();</script></body>
